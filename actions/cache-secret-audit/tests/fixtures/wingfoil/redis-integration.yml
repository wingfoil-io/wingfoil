name: test.integration.redis

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/redis-integration.yml'
      - 'crates/wingfoil/src/adapters/redis**'
      - 'crates/wingfoil/tests/redis_integration.rs'
      - 'crates/wingfoil-python/src/adapters/redis.rs'
      - 'crates/wingfoil-python/tests/test_redis.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/redis-integration.yml'
      - 'crates/wingfoil/src/adapters/redis**'
      - 'crates/wingfoil/tests/redis_integration.rs'
      - 'crates/wingfoil-python/src/adapters/redis.rs'
      - 'crates/wingfoil-python/tests/test_redis.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: redis-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Instrumented run is post-merge only; see README.md. Allow-list, not
  # `!= 'pull_request'`: under `workflow_call` the event is the caller's.
  WF_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Same condition again — `env` cannot reference itself here. Used unquoted
  # below, so it word-splits into the command and its flags.
  WF_CARGO_TEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'cargo llvm-cov --no-report' || 'cargo test' }}

jobs:
  redis-integration:
    name: redis Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install cargo-llvm-cov
        if: env.WF_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage collection
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull redis image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes. Pull once up front with
        # retries so every test reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull redis:7-alpine && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull redis image after 3 attempts" && exit 1

      - name: Run redis integration tests
        # Just this binary — the shared suite is rust-test.yml's job.
        run: |
          $WF_CARGO_TEST --features redis-integration-test -p wingfoil \
            --test redis_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # No `if: always()`: a half-run report would become this flag's baseline.
      - name: Export Redis coverage
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload Redis coverage to Codecov
        if: env.WF_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          flags: redis
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # --- Python bindings (wingfoil-python) ---
      # The Rust tests above use testcontainers (per-test container); the Python
      # tests expect a fixed localhost:6379, so start one explicitly.
      - name: Start redis container for Python tests
        run: |
          docker run -d --name redis-py -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            nc -z localhost 6379 && echo "redis ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 6379 || (echo "redis never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop

      - name: Run Python redis integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_redis tests/test_redis.py -v
        env:
          RUST_LOG: INFO

      - name: Dump redis logs on failure
        if: failure()
        run: docker logs redis-py

      - name: Stop redis container
        if: always()
        run: docker rm -f redis-py || true
