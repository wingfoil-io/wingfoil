name: test.integration.zmq

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/zmq-integration.yml'
      - 'crates/wingfoil/src/adapters/zmq**'
      - 'crates/wingfoil/tests/zmq_integration.rs'
      - 'crates/wingfoil/tests/zmq_etcd_integration.rs'
      - 'crates/wingfoil/tests/zmq_cross_lang_integration.rs'
      - 'crates/wingfoil-python/src/adapters/zmq.rs'
      - 'crates/wingfoil-python/tests/test_zmq.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/zmq-integration.yml'
      - 'crates/wingfoil/src/adapters/zmq**'
      - 'crates/wingfoil/tests/zmq_integration.rs'
      - 'crates/wingfoil/tests/zmq_etcd_integration.rs'
      - 'crates/wingfoil/tests/zmq_cross_lang_integration.rs'
      - 'crates/wingfoil-python/src/adapters/zmq.rs'
      - 'crates/wingfoil-python/tests/test_zmq.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: zmq-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Instrumented run is post-merge only; see README.md. Allow-list, not
  # `!= 'pull_request'`: under `workflow_call` the event is the caller's.
  WF_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Same condition again — `env` cannot reference itself here. Used unquoted
  # below, so it word-splits into the command and its flags.
  WF_CARGO_TEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'cargo llvm-cov --no-report' || 'cargo test' }}

jobs:
  zmq-integration:
    name: ZMQ Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install cargo-llvm-cov
        if: env.WF_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage collection
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Install system dependencies
        # `libzmq` is linked by the `zmq` crate; `protoc` is needed by a
        # transitive build dependency.
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config protobuf-compiler

      - name: Pre-pull etcd image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes. Pull once up front with
        # retries so every discovery test reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull gcr.io/etcd-development/etcd:v3.5.0 && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull etcd image after 3 attempts" && exit 1

      - name: Run ZMQ core pub/sub integration tests
        run: |
          $WF_CARGO_TEST --features zmq-integration-test -p wingfoil \
            --test zmq_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      - name: Run ZMQ etcd discovery integration tests
        run: |
          $WF_CARGO_TEST --features zmq-etcd-integration-test -p wingfoil \
            --test zmq_etcd_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # --- Python bindings (wingfoil-python) ---
      # The binding's `requires_etcd` tier covers `zmq_sub_etcd` / `zmq_pub_etcd`,
      # which only exist when the module carries *both* features. The Rust tests
      # above use testcontainers (per-test container); the Python tests expect a
      # fixed localhost:2379, so start one explicitly.
      - name: Start etcd container for Python tests
        run: |
          docker run -d \
            --name etcd-zmq-py \
            -p 2379:2379 \
            -e ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379 \
            -e ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379 \
            gcr.io/etcd-development/etcd:v3.5.0
          for i in $(seq 1 30); do
            nc -z localhost 2379 && echo "etcd ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 2379 || (echo "etcd never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        # `-F zmq,etcd`: the `_etcd` discovery pair is compiled only when both
        # features are on, and it is the tier this job exists to cover.
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop -F zmq,etcd

      - name: Run Python ZMQ etcd discovery tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_etcd tests/test_zmq.py -v
        env:
          RUST_LOG: INFO

      - name: Run ZMQ cross-language tests (Rust ↔ Python)
        # The Rust side shells out to `python3`, so the venv holding the freshly
        # built bindings has to come first on PATH — otherwise the tests find
        # the system interpreter, `import wingfoil` fails, and they abort
        # (by design: these fail rather than skip).
        #
        # Both feature sets in one invocation: `zmq-cross-lang-etcd-test`
        # enables `zmq-cross-lang-test`, and its etcd cases bring up their own
        # container through testcontainers.
        run: |
          export PATH="$GITHUB_WORKSPACE/crates/wingfoil-python/.venv/bin:$PATH"
          python3 -c 'import wingfoil' \
            || (echo "bindings not importable from the venv on PATH" && exit 1)
          $WF_CARGO_TEST --features zmq-cross-lang-etcd-test -p wingfoil \
            --test zmq_cross_lang_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # No `if: always()`: a half-run report would become this flag's baseline.
      - name: Export combined ZMQ coverage
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload ZMQ coverage to Codecov
        if: env.WF_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          flags: zmq
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Dump etcd logs on failure
        if: failure()
        run: docker logs etcd-zmq-py

      - name: Stop etcd container
        if: always()
        run: docker rm -f etcd-zmq-py || true
