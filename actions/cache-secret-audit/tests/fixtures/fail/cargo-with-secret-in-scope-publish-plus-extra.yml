# The registry-token carve-out does not cover a second secret, or a build.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: cargo publish
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo build && cargo publish
