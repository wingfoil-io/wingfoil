on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: build
      - run: cargo build
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: target
          key: build
      - uses: actions/cache@v4
        if: ${{ github.event_name == 'push' && success() }}
        with:
          path: ~/.cargo
          key: registry
