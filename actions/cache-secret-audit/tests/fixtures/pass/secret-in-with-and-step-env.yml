# The shape wingfoil's own workflows use: secrets passed to an action via
# `with:`, or to a non-cargo step via its own `env:`, never to cargo.
on:
  workflow_call:
  pull_request:
env:
  CARGO_TERM_COLOR: always
  WF_CARGO_TEST: ${{ github.event_name == 'push' && 'cargo llvm-cov' || 'cargo test' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - env:
          GH_PUSH_TOKEN: ${{ secrets.WF_REBASE_PAT }}
        run: git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/o/r.git"
