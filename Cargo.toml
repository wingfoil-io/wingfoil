
[workspace]
members = [
    "wingfoil",
    "wingfoil-derive",
    "wingfoil-python",
    "wingfoil-wire-types",
    "next/crates/wingfoil-next",
    "next/crates/wingfoil-next-macros",
    "next/crates/wingfoil-next-python",
    "next/crates/wingfoil-next-python-macros",
]
# wingfoil-wasm is excluded from the default workspace because it targets
# wasm32-unknown-unknown and depends on a different lock file / toolchain.
exclude = [
    "wingfoil-wasm",
]
resolver = "3"

[workspace.package]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# The `latency_stages!` derive unconditionally emits an
# `#[cfg(feature = "iceoryx2")]` ZeroCopySend impl. Crates that invoke the
# macro without an `iceoryx2` feature (e.g. wingfoil-next) would otherwise get
# an `unexpected_cfgs` warning; declare the feature name as known so the gate
# simply stays off there. `wingfoil` has a real `iceoryx2` feature already.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("iceoryx2"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
needless_doctest_main = "allow"
perf = { level = "warn", priority = -1 }


[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
derive_more = { version = "2.1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
tracing = "0.1"

[profile.release]
debug = true            # Include debug info for profiling (perf, hotspot)
#opt-level = 3       # Options: 0, 1, 2, 3, "s" (size), "z" (min size), 3 is max speed
#lto = "fat"            # Link Time Optimization (fat = max optimization)
#codegen-units = 1      # Single codegen unit = better optimizations
#panic = "abort"        # Smaller binary + faster panics
#overflow-checks = false # Disable integer overflow checks for speed

