
[workspace]
members = [
    "crates/wingfoil",
    "crates/wingfoil-derive",
    "crates/wingfoil-python",
    "crates/wingfoil-python-derive",
    "crates/wingfoil-wire-types",
]
# wingfoil-wasm is excluded from the default workspace because it targets
# wasm32-unknown-unknown and depends on a different lock file / toolchain.
exclude = [
    "crates/wingfoil-wasm",
]
resolver = "3"

[workspace.package]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# The `latency_stages!` derive unconditionally emits an
# `#[cfg(feature = "iceoryx2")]` ZeroCopySend impl. Crates that invoke the
# macro without an `iceoryx2` feature (e.g. wingfoil) would otherwise get
# an `unexpected_cfgs` warning; declare the feature name as known so the gate
# simply stays off there. `wingfoil` has a real `iceoryx2` feature already.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("iceoryx2"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
needless_doctest_main = "allow"
perf = { level = "warn", priority = -1 }


[workspace.dependencies]
# Every dependency named by two or more members lives here so the two cannot
# drift to different floors — which `thiserror` and `serde` already had.
# Version here, features at the member. Invisible to consumers: `cargo package`
# flattens `workspace = true` to a literal. Single-member deps stay at their
# member; `wingfoil-wasm` is its own workspace root and cannot inherit at all.
# Floors are chosen per the dependency policy in CLAUDE.md.
anyhow = "1.0"
bincode = "1.3.3"
# Only `DateTime` / `NaiveDateTime` in the core; `Utc::now()` is reached from
# the `fix` adapter alone, which adds `chrono/now` itself. Drops the default
# `clock` (and iana-time-zone). Must be set here — cargo forbids a member
# overriding a workspace entry's `default-features`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
criterion = "0.8.1"
csv = "1.4"
# `Display` is the only derive used here (`runtime/time.rs`). Removes no crate
# — convert_case is unconditional in derive_more-impl — just its codegen.
derive_more = { version = "2.1", features = ["display"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
proc-macro2 = "1.0"
pyo3 = "0.29"
quote = "1.0"
rdkafka = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"

# Debuginfo is over half the bulk of target/ (stripping the 40 largest rlibs of
# a dev build takes them from 810MB to 378MB), and it is not paid for once — it
# is copied into every statically-linked binary. This workspace has ~69 example
# and bench targets, so a `--all-targets` build carries ~69 copies of the whole
# dependency graph's debuginfo and lands around 23GB.
#
# We never single-step into a dependency, so drop their debuginfo and keep our
# own at full fidelity: workspace members are unaffected by a `package."*"`
# override, so backtraces and debugger stepping through wingfoil code are
# exactly as before. Only frames inside third-party crates lose line numbers.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = true            # Include debug info for profiling (perf, hotspot)
#opt-level = 3       # Options: 0, 1, 2, 3, "s" (size), "z" (min size), 3 is max speed
#lto = "fat"            # Link Time Optimization (fat = max optimization)
#codegen-units = 1      # Single codegen unit = better optimizations
#panic = "abort"        # Smaller binary + faster panics
#overflow-checks = false # Disable integer overflow checks for speed

