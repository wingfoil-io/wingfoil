# Workspace root for the legacy `MutableNode` engine.
#
# The legacy tree used to be three members of the repo-root workspace. It was
# split out ahead of the cutover rename (cutover-plan 5.0): `wingfoil-next`
# becomes `wingfoil` (1.2) while this tree is still on disk, and one workspace
# cannot hold two packages called `wingfoil`. Splitting also takes
# `wingfoil-python`'s 13-feature roll-up out of the root feature unification,
# which is what made a plain root `cargo build --workspace` compile most of the
# `full` tree.
#
# Build and test this tree from the repo root with `--manifest-path`:
#
#     cargo test  --manifest-path legacy/Cargo.toml --workspace
#     cargo clippy --manifest-path legacy/Cargo.toml --workspace --all-targets
#
# or with the `test-legacy` / `lint-legacy` aliases in `.cargo/config.toml`.
#
# The three members all inherit `rust-version`, `lints` and several dependency
# versions, and an excluded package is *not* a workspace member and cannot
# inherit — so the tables below are copies of the root ones, deliberately kept
# byte-identical. They are not a place to diverge: this whole file is deleted
# with the tree at the cutover's second step.

[workspace]
members = [
    "wingfoil",
    "wingfoil-derive",
    "wingfoil-python",
]
resolver = "3"

[workspace.package]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# The `latency_stages!` derive unconditionally emits an
# `#[cfg(feature = "iceoryx2")]` ZeroCopySend impl. Crates that invoke the
# macro without an `iceoryx2` feature would otherwise get an `unexpected_cfgs`
# warning; declare the feature name as known so the gate simply stays off
# there. `wingfoil` has a real `iceoryx2` feature already.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("iceoryx2"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
needless_doctest_main = "allow"
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
derive_more = { version = "2.1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
tracing = "0.1"

# Same reasoning as the root workspace: debuginfo is over half the bulk of
# target/, and it is copied into every statically-linked example and bench
# binary. Workspace members are excluded from a `package."*"` override, so
# stepping through wingfoil code is unaffected.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = true            # Include debug info for profiling (perf, hotspot)
