<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Wingfoil logo mark">
  <!--
    RECONSTRUCTION, NOT THE AUTHENTIC ASSET.

    Traced by eye from an image of the mark, because this session's network
    egress policy blocks wingfoil.io and the real SVG could not be fetched.
    Flat-top hexagon ring with a rounded inner counter, magenta at the
    top-left running to cyan at the bottom-right — the silhouette, proportions
    and gradient direction are close; the inner counter's exact geometry and
    the gradient stops are approximations.

    To use the real one: drop it in beside this file, point the two
    <img class="mark"> tags in index.html at it, and drop "-reconstructed"
    from the filename.
  -->
  <defs>
    <linearGradient id="wf" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0"    stop-color="#f03cd8"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1"    stop-color="#22c9f5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#wf)" stroke-linejoin="round" stroke-linecap="round">
    <!-- flat-top hexagon ring -->
    <path d="M18.9 8.9 H45.1 L58.2 32 L45.1 55.1 H18.9 L5.8 32 Z"
          stroke-width="6"/>
    <!-- inner counter: rounded upright capsule, open at the lower left -->
    <path d="M25.5 43.6 V27.4 A6.5 6.5 0 0 1 32 20.9
             A6.5 6.5 0 0 1 38.5 27.4 V36.6
             A6.5 6.5 0 0 1 32 43.1 H25.5"
          stroke-width="5.5"/>
  </g>
</svg>
