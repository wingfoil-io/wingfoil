# .readthedocs.yaml
version: 2

# Build configuration
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    rust: "1.91"
  apt_packages:
    - protobuf-compiler

# Python environment setup
python:
  install:
    - method: pip
      path: crates/wingfoil-python
    - requirements: crates/wingfoil-python/docs/requirements.txt

# Sphinx configuration
sphinx:
  configuration: crates/wingfoil-python/docs/conf.py

# Optionally specify the docs folder and branch
formats:
  - htmlzip
  - pdf
