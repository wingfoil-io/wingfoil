[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "wingfoil-next-python"
dynamic = ["version"]
description = "Python interop prototype for wingfoil-next (the Op-pattern engine)"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["maturin>=1.4,<2.0", "pytest>=7"]

[tool.maturin]
# `extension-module` resolves Python symbols at load time (no libpython link in
# the wheel). Importing `wingfoil_next` gives the Graph / Stream classes.
#
# Adapter features are listed one by one rather than via the `all-adapters`
# roll-up, so each new adapter binding is a considered decision: an adapter that
# is pure Rust (postgres, on tokio-postgres) can ship in the default wheel,
# whereas one needing a system library at build time must stay opt-in
# (`maturin develop -F kdb`) or it breaks the build for everyone.
#
# kafka is deliberately *not* here, for a different reason: `rdkafka` builds
# librdkafka from source, so it needs no system library but adds minutes to
# every wheel build. Opt in with `maturin develop -F kafka`. CI builds it — the
# next-python workflow develops with `-F all-adapters` so each binding's
# service-free pytest tier actually runs.
features = ["extension-module", "postgres"]
# Mixed layout: the compiled extension is the *private* `wingfoil_next._wingfoil`
# and the importable `wingfoil_next` is the Python package under `python/`, which
# re-exports it wholesale and adds the pure-Python surface (`CustomStream`).
# `import wingfoil_next as wf` is unchanged for callers.
python-source = "python"
module-name = "wingfoil_next._wingfoil"
include = ["Cargo.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are deselected by default so the regular `pytest` run is
# never silently green against a service that is not actually up. Each
# integration workflow opts in explicitly, e.g. `pytest -m requires_postgres`.
# Running a marker selection without the backing service fails loudly with a
# real ConnectionRefused/import error — not a skip.
markers = [
    "requires_postgres: needs PostgreSQL on localhost:5432",
    "requires_kafka: needs a Kafka broker on localhost:9092",
]
addopts = "-m 'not requires_postgres and not requires_kafka'"
