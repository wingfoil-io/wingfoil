[package]
name = "wingfoil-next"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Design prototype: dual-mode (interpreted + compiled) stream graphs with single-sourced op semantics"

[lints]
workspace = true

[dependencies]
# Reuses the clock/scheduler core (`codegen::Kernel`), `NanoTime` and the
# run-mode types. Everything else — the Op trait, ops, and engines — is
# from-scratch.
wingfoil = { path = "../../../wingfoil" }
wingfoil-next-macros = { path = "../wingfoil-next-macros" }
anyhow = { workspace = true }
# `Burst<T>` is `tinyvec::TinyVec<[T; 1]>`, and the re-exported `burst!` macro
# expands to `::tinyvec::tiny_vec!` — so the crate needs `tinyvec` in scope for
# that macro to resolve. Version mirrors the classic `wingfoil` crate.
tinyvec = { version = "1.10.0", features = ["alloc"] }
# Used by the always-compiled `adapters::common` module (the out-of-window row
# filter's summary warning). Version mirrors the classic `wingfoil` crate.
log = { workspace = true }

# `async` feature: the `produce_async` ergonomic source (async closure →
# timestamped burst stream) over the channel. Optional so the core engine
# stays executor-free.
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
], optional = true }

# `csv` feature: the serde-typed CSV replay source + file sink adapter. Optional
# so the default build stays dependency-free. Versions mirror the classic
# `wingfoil` crate's csv adapter.
csv = { version = "1.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-aux = { version = "4.7.0", optional = true }

# `cache` feature: a file-backed, query-keyed, LRU-evicting result cache for
# time-sliced historical readers (classic `kdb_read_cached`). Async file IO
# (tokio's `fs`), bincode payload framing, and a stable SHA-256 cache key.
# Versions mirror the classic `wingfoil` crate's kdb/cache deps.
sha2 = { version = "0.10", optional = true }
bincode = { version = "1.3.3", optional = true }

# `augurs` feature: on-graph time-series forecasting + outlier detection. A
# pure-Rust compute library (no external service), so — like the classic
# `wingfoil` augurs adapter — coverage lives behind `--features augurs` with no
# integration-test split. Pinned and default-features-off, mirroring the classic
# crate; only the `ets`, `mstl`, and `outlier` sub-features are enabled, matching
# the two ported ops (Prophet is deliberately excluded — it needs a bundled Stan
# toolchain).
augurs = { version = "0.10.2", default-features = false, features = [
    "ets",
    "mstl",
    "outlier",
], optional = true }

# `etcd` feature: streaming key-prefix snapshot + watch source and a key-value
# PUT sink for the etcd key-value store. Built on the `async` `produce_async`
# ergonomic (`etcd-client` is a tokio client). Versions mirror the classic
# `wingfoil` crate's etcd adapter so the two trees don't drift. `testcontainers`
# (used only by the integration tests) is an optional [dependencies] entry
# because feature flags cannot gate dev-dependencies.
etcd-client = { version = "0.18", optional = true }
async-stream = { version = "0.3.6", optional = true }
testcontainers = { version = "0.27", features = [
    "blocking",
], optional = true }

# `redis` feature: Pub/Sub (`SUBSCRIBE`/`PUBLISH`) and Streams
# (`XRANGE`/`XREAD`/`XADD`) transports. Built on the `async` `produce_async`
# source and `consume_async` sink ergonomics (`redis` is a tokio client).
# Version + features mirror the classic `wingfoil` crate's redis adapter so the
# two trees don't drift. Reuses the optional `async-stream` and `testcontainers`
# entries above (testcontainers is only used by the gated integration tests).
redis = { version = "0.27", features = [
    "tokio-comp",
    "aio",
    "streams",
], optional = true }
# `kafka` feature: a streaming topic-consume source and a topic-produce sink for
# Apache Kafka, built on the async `produce_async` / `consume_async` ergonomics
# (`rdkafka` is a tokio client). Version mirrors the classic `wingfoil` crate's
# kafka adapter so the two trees don't drift. As classic does, the bundled
# `librdkafka` uses rdkafka's default build path (`./configure` + `make`); the
# `cmake-build` feature is deliberately not enabled (its curl.h dependency breaks
# CI). `testcontainers` (used only by the integration tests) is already an
# optional [dependencies] entry above, shared with the etcd adapter.
rdkafka = { version = "0.37", optional = true }

# `postgres` feature: time-partitioned historical reads, a `LISTEN`/`NOTIFY`
# live-tail source, and a streaming insert sink, on the async `tokio-postgres`
# client. Built on `async` (the `Handle::block_on` reader/sink and the
# `produce_async` live tail) and `async-stream` (the sub's `stream!` macro).
# Versions mirror the classic `wingfoil` crate's postgres adapter (tokio-postgres
# 0.7 with `with-chrono-0_4`, chrono 0.4) so the two trees don't drift. Reuses the
# optional `testcontainers` entry (used only by the gated integration tests).
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
], optional = true }
chrono = { version = "0.4", optional = true }

# `prometheus` feature: a realtime, pull-based metrics sink serving a hand-rolled
# `GET /metrics` endpoint (no Prometheus client crate — just `std::net` + a
# lock-free `arc-swap` slot per metric). `reqwest` (used only by the end-to-end
# scrape integration test) is an optional [dependencies] entry because feature
# flags cannot gate dev-dependencies. Versions mirror the classic `wingfoil`
# crate's prometheus adapter so the two trees don't drift.
arc-swap = { version = "1.7", optional = true }
reqwest = { version = "0.12", features = [
    "json",
    "blocking",
], optional = true }

# `zmq` feature: real-time pub/sub over ØMQ sockets (`zmq_sub` source +
# `ZeroMqPub` sink), with optional etcd-based service discovery. Synchronous and
# poll-based, so — like the classic `wingfoil` zmq adapter — it uses a background
# thread over the `channel` layer and deliberately does NOT pull in `async`.
# Messages are `bincode`-framed (reuses the optional `bincode`/`serde` entries
# above). Version mirrors the classic `wingfoil` crate's zmq adapter so the two
# trees don't drift; the `zmq` crate links the system `libzmq` (Debian/Ubuntu:
# `libzmq3-dev`).
zmq = { version = "0.10.0", optional = true }
# `otlp` feature: a realtime, push-based OpenTelemetry metrics sink. Exports
# stream values as OTLP gauge metrics over HTTP/protobuf to any OTLP-compatible
# backend (Grafana Alloy, Datadog, Honeycomb, New Relic, …). Built on the async
# `consume_async` ergonomic so exports run off the graph thread (the OTel SDK's
# `rt-tokio` PeriodicReader needs a tokio runtime). Only the metrics features are
# enabled (the classic trace/span exporter is a deferred deviation — it needs the
# `Traced`/`HasLatency` latency infrastructure, not yet ported to next; see
# `src/adapters/otlp.rs`).
#
# NOTE — deliberate divergence from classic: next pins opentelemetry* 0.32 while
# classic still ships 0.28. This is to clear GHSA-w9wp-h8wv-79jx (opentelemetry_sdk
# < 0.29: unbounded allocation in W3C Baggage propagation), which the dependency-
# review gate flags on the newly added next dep. The 0.32 API is source-compatible
# with the adapter's usage (no code change needed). Classic should be bumped to
# match in a follow-up to restore lockstep and fix the same advisory there.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = [
    "metrics",
    "rt-tokio",
], optional = true }
opentelemetry-otlp = { version = "0.32", features = [
    "http-proto",
    "reqwest-blocking-client",
    "metrics",
], optional = true }

[dev-dependencies]
# Compile-fail tests pinning the `graph!` macro's key error paths.
trybuild = "1"
criterion = "0.8.1"

[features]
default = []
# `tokio/sync` backs `consume_async`'s bounded/unbounded sink channels; it is
# part of the async module, so the feature enables it directly rather than
# relying on a companion adapter (etcd-client) to pull it in transitively.
async = ["dep:tokio", "dep:futures", "tokio/sync"]
csv = ["dep:csv", "dep:serde", "dep:serde-aux"]
# File-backed result cache. Reuses `async` for the tokio runtime and adds
# tokio's `fs` for the async file IO. Mirrors classic wingfoil's `kdb` deps
# (`sha2`, `bincode`, `async`, `tokio/fs`).
cache = ["dep:sha2", "dep:bincode", "dep:serde", "async", "tokio/fs"]
augurs = ["dep:augurs"]
etcd = ["dep:etcd-client", "dep:async-stream", "async"]
etcd-integration-test = ["etcd", "dep:testcontainers"]
# Redis Pub/Sub + Streams adapter. Built on `async` (produce_async source +
# consume_async sink) and `async-stream` (the snapshot→tail stream! macro).
redis = ["dep:redis", "dep:async-stream", "async"]
redis-integration-test = ["redis", "dep:testcontainers"]
# PostgreSQL adapter. Built on `async` (produce_async live tail + block_on
# reader/sink) and `async-stream` (the sub's `stream!` macro); `chrono` for the
# timestamp column conversions.
postgres = ["dep:tokio-postgres", "dep:chrono", "dep:async-stream", "async"]
postgres-integration-test = ["postgres", "dep:testcontainers"]
# Streaming Kafka consume source + produce sink. Built on the async
# `produce_async` / `consume_async` ergonomics; needs `async-stream` for the
# consumer's `recv()` loop. Mirrors classic wingfoil's `kafka` deps.
kafka = ["dep:rdkafka", "dep:async-stream", "async"]
kafka-integration-test = ["kafka", "dep:testcontainers"]
# Realtime pull-based Prometheus metrics sink (hand-rolled HTTP + `arc-swap`).
prometheus = ["dep:arc-swap"]
# Adds the end-to-end scrape test (a live Prometheus scraping the exporter);
# `reqwest` (blocking) queries Prometheus. Mirrors classic wingfoil.
prometheus-integration-test = ["prometheus", "dep:reqwest"]
# ZMQ pub/sub adapter. `bincode`/`serde` frame the wire envelope; the `zmq` crate
# links the system `libzmq`. No `async` — the subscriber uses a background thread
# over the `channel` layer (matching classic).
zmq = ["dep:zmq", "dep:bincode", "dep:serde"]
# Core pub/sub parity tests (real sockets, no external service / container).
zmq-integration-test = ["zmq"]
# etcd service-discovery parity tests (needs Docker via testcontainers). Enables
# the `etcd`-gated `EtcdRegistry` discovery backend alongside `zmq`.
zmq-etcd-integration-test = ["zmq", "etcd", "dep:testcontainers"]
# Realtime push-based OpenTelemetry (OTLP) metrics sink. Reuses `async` for the
# tokio runtime `consume_async` needs. Mirrors classic wingfoil's `otlp`.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "async",
]
# Adds the self-contained OTLP integration test (a testcontainers OTel collector
# the sink exports to). Mirrors classic wingfoil.
otlp-integration-test = ["otlp", "dep:testcontainers"]
# Runtime graph dynamism: append nodes and splice edges into a live graph
# mid-run (`Runner::run_dynamic` + `Extension`). Mirrors classic wingfoil's
# `dynamic-graph` feature; off the default hot path until wired in. The layered
# `(layer, index)` dispatch it relies on is always on (it is byte-identical to
# the old index order on static graphs).
dynamic-graph = []

[[example]]
name = "async_source"
required-features = ["async"]

[[example]]
name = "produce_async_feed"
required-features = ["async"]

# Port of the classic `async` example: an async `produce_async` producer driving
# the graph (the graph itself is the consumer). Needs tokio + futures.
[[example]]
name = "async"
path = "examples/async/main.rs"
required-features = ["async"]

