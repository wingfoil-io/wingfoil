[package]
name = "wingfoil-next"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Design prototype: dual-mode (interpreted + compiled) stream graphs with single-sourced op semantics"

[lints]
workspace = true

[dependencies]
# Reuses the clock/scheduler core (`codegen::Kernel`), `NanoTime` and the
# run-mode types. Everything else — the Op trait, ops, and engines — is
# from-scratch.
wingfoil = { path = "../../../wingfoil" }
wingfoil-next-macros = { path = "../wingfoil-next-macros" }
anyhow = { workspace = true }
# `Burst<T>` is `tinyvec::TinyVec<[T; 1]>`, and the re-exported `burst!` macro
# expands to `::tinyvec::tiny_vec!` — so the crate needs `tinyvec` in scope for
# that macro to resolve. Version mirrors the classic `wingfoil` crate.
tinyvec = { version = "1.10.0", features = ["alloc"] }
# Used by the always-compiled `adapters::common` module (the out-of-window row
# filter's summary warning). Version mirrors the classic `wingfoil` crate.
log = { workspace = true }

# `async` feature: the `produce_async` ergonomic source (async closure →
# timestamped burst stream) over the channel. Optional so the core engine
# stays executor-free.
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
], optional = true }

# `csv` feature: the serde-typed CSV replay source + file sink adapter. Optional
# so the default build stays dependency-free. Versions mirror the classic
# `wingfoil` crate's csv adapter.
csv = { version = "1.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-aux = { version = "4.7.0", optional = true }

# `cache` feature: a file-backed, query-keyed, LRU-evicting result cache for
# time-sliced historical readers (classic `kdb_read_cached`). Async file IO
# (tokio's `fs`), bincode payload framing, and a stable SHA-256 cache key.
# Versions mirror the classic `wingfoil` crate's kdb/cache deps.
sha2 = { version = "0.10", optional = true }
bincode = { version = "1.3.3", optional = true }

# `augurs` feature: on-graph time-series analysis — forecasting, outlier /
# changepoint / season detection, DTW and clustering. A pure-Rust compute
# library (no external service), so — like the classic `wingfoil` augurs
# adapter — coverage lives behind `--features augurs` with no integration-test
# split. Pinned, default-features-off, and with the same sub-feature set as the
# classic crate, one per ported op (Prophet is deliberately excluded — it needs
# a bundled Stan toolchain).
augurs = { version = "0.10.2", default-features = false, features = [
    "ets",
    "mstl",
    "outlier",
    "changepoint",
    "seasons",
    "dtw",
    "clustering",
], optional = true }

# `etcd` feature: streaming key-prefix snapshot + watch source and a key-value
# PUT sink for the etcd key-value store. Built on the `async` `produce_async`
# ergonomic (`etcd-client` is a tokio client). Versions mirror the classic
# `wingfoil` crate's etcd adapter so the two trees don't drift. `testcontainers`
# (used only by the integration tests) is an optional [dependencies] entry
# because feature flags cannot gate dev-dependencies.
etcd-client = { version = "0.18", optional = true }
async-stream = { version = "0.3.6", optional = true }
testcontainers = { version = "0.27", features = [
    "blocking",
], optional = true }

# `redis` feature: Pub/Sub (`SUBSCRIBE`/`PUBLISH`) and Streams
# (`XRANGE`/`XREAD`/`XADD`) transports. Built on the `async` `produce_async`
# source and `consume_async` sink ergonomics (`redis` is a tokio client).
# Version + features mirror the classic `wingfoil` crate's redis adapter so the
# two trees don't drift. Reuses the optional `async-stream` and `testcontainers`
# entries above (testcontainers is only used by the gated integration tests).
redis = { version = "0.27", features = [
    "tokio-comp",
    "aio",
    "streams",
], optional = true }
# `kafka` feature: a streaming topic-consume source and a topic-produce sink for
# Apache Kafka, built on the async `produce_async` / `consume_async` ergonomics
# (`rdkafka` is a tokio client). Version mirrors the classic `wingfoil` crate's
# kafka adapter so the two trees don't drift. As classic does, the bundled
# `librdkafka` uses rdkafka's default build path (`./configure` + `make`); the
# `cmake-build` feature is deliberately not enabled (its curl.h dependency breaks
# CI). `testcontainers` (used only by the integration tests) is already an
# optional [dependencies] entry above, shared with the etcd adapter.
rdkafka = { version = "0.37", optional = true }

# `web` feature: bidirectional WebSocket streaming between the graph and one or
# more browsers — an axum HTTP/WS server on its own runtime, plus the graph-side
# publish sink and subscribe source. The wire types live in the shared
# `wingfoil-wire-types` crate so the server, `wingfoil-wasm` and `@wingfoil/client`
# cannot drift; the protocol is engine-agnostic and reused as-is by this port.
# Versions mirror the classic `wingfoil` crate's web adapter so the two trees
# don't drift.
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
wingfoil-wire-types = { path = "../../../wingfoil-wire-types", version = "8.0.0", optional = true }
# web adapter — TLS (rustls) support; gated behind the `web-tls` feature.
# `rustls` itself is already an optional dependency above (shared with `fix`).
axum-server = { version = "0.7", default-features = false, features = [
    "tls-rustls-no-provider",
], optional = true }
rustls-pemfile = { version = "2", optional = true }

# Used only by the web-tls integration test: `rcgen` generates a fresh
# self-signed cert at test time (cheaper and more deterministic than shipping a
# static fixture that would need rotating), `scopeguard` removes the PEM files
# afterwards. Optional [dependencies] entries because feature flags cannot gate
# dev-dependencies. Versions mirror the classic `wingfoil` crate.
rcgen = { version = "0.13", optional = true }
scopeguard = { version = "1.2.0", optional = true }
# `fluvio` feature: a streaming topic-partition consume source and a
# topic-produce sink for Fluvio clusters, built on the async `produce_async` /
# `consume_async_bursts` ergonomics (`fluvio` is a tokio client). Versions mirror
# the classic `wingfoil` crate's fluvio adapter so the two trees don't drift.
# `fluvio-controlplane-metadata` is only used by the integration tests (to
# register the SPU with the SC before starting it); `testcontainers` is already
# an optional [dependencies] entry above, shared with the etcd adapter.
fluvio = { version = "0.50.1", optional = true }
fluvio-controlplane-metadata = { version = "0.50.1", optional = true }
# `aeron` feature: the Aeron IPC/UDP low-latency message transport. Like classic
# (and unlike the networked async adapters) it is synchronous/poll-based, so it
# does NOT pull in `async`. Two pluggable backends behind their own features:
# `rusteron-client` (C++ FFI, production — needs cmake >= 3.30, clang, uuid-dev,
# libbsd-dev) and `aeron-rs` (pure Rust, experimental — see the module docs'
# lock warning). Versions mirror the classic `wingfoil` crate's aeron adapter so
# the two trees don't drift.
rusteron-client = { version = "0.1", optional = true }
rusteron-media-driver = { version = "0.1", optional = true }
aeron-rs = { version = "0.1", optional = true }
# Used only by the aeron integration tests, to run the media-driver container as
# the current uid/gid so the CNC file stays writable by the test process.
libc = { version = "0.2", optional = true }
# `iceoryx2` feature: zero-copy inter-process (and intra-process) publish/
# subscribe over shared memory. Pure Rust — no native toolchain — and, like the
# classic `wingfoil` iceoryx2 adapter, synchronous/poll-based, so it does NOT
# pull in `async`. Version mirrors the classic `wingfoil` crate's iceoryx2
# adapter so the two trees don't drift. `thiserror` backs the adapter's typed
# error enum (ported from classic).
iceoryx2 = { version = "0.8", optional = true }
thiserror = { version = "2.0", optional = true }

# `postgres` feature: time-partitioned historical reads, a `LISTEN`/`NOTIFY`
# live-tail source, and a streaming insert sink, on the async `tokio-postgres`
# client. Built on `async` (the `Handle::block_on` reader/sink and the
# `produce_async` live tail) and `async-stream` (the sub's `stream!` macro).
# Versions mirror the classic `wingfoil` crate's postgres adapter (tokio-postgres
# 0.7 with `with-chrono-0_4`, chrono 0.4) so the two trees don't drift. Reuses the
# optional `testcontainers` entry (used only by the gated integration tests).
tokio-postgres = { version = "0.7", features = [
    "with-chrono-0_4",
], optional = true }
chrono = { version = "0.4", optional = true }

# `kdb` feature: KDB+/q connectivity — time-partitioned historical reads
# (`kdb_read`, `kdb_read_cached`), a real-time tickerplant subscription
# (`kdb_sub`), and a streaming insert sink (`kdb_write`), on the async `kdbplus`
# IPC client (`QStream`). Built on `async` (the `produce_async` reader/sub +
# `consume_async` sink), `async-stream` (the reader/sub `stream!` macros),
# `chrono` (the write timestamp column), and the `cache` feature (the file cache
# behind `kdb_read_cached`). Version mirrors the classic `wingfoil` crate's kdb
# adapter so the two trees don't drift; `ipc` is the KDB IPC protocol feature.
kdb-plus-fixed = { version = "0.5.0", features = ["ipc"], optional = true }

# `prometheus` feature: a realtime, pull-based metrics sink serving a hand-rolled
# `GET /metrics` endpoint (no Prometheus client crate — just `std::net` + a
# lock-free `arc-swap` slot per metric). `reqwest` (used only by the end-to-end
# scrape integration test) is an optional [dependencies] entry because feature
# flags cannot gate dev-dependencies. Versions mirror the classic `wingfoil`
# crate's prometheus adapter so the two trees don't drift.
arc-swap = { version = "1.7", optional = true }
reqwest = { version = "0.12", features = [
    "json",
    "blocking",
], optional = true }

# `zmq` feature: real-time pub/sub over ØMQ sockets (`zmq_sub` source +
# `ZeroMqPub` sink), with optional etcd-based service discovery. Synchronous and
# poll-based, so — like the classic `wingfoil` zmq adapter — it uses a background
# thread over the `channel` layer and deliberately does NOT pull in `async`.
# Messages are `bincode`-framed (reuses the optional `bincode`/`serde` entries
# above). Version mirrors the classic `wingfoil` crate's zmq adapter so the two
# trees don't drift; the `zmq` crate links the system `libzmq` (Debian/Ubuntu:
# `libzmq3-dev`).
zmq = { version = "0.10.0", optional = true }
# `otlp` feature: a realtime, push-based OpenTelemetry metrics sink. Exports
# stream values as OTLP gauge metrics over HTTP/protobuf to any OTLP-compatible
# backend (Grafana Alloy, Datadog, Honeycomb, New Relic, …). Built on the async
# `consume_async` ergonomic so exports run off the graph thread (the OTel SDK's
# `rt-tokio` PeriodicReader needs a tokio runtime). Both the `metrics` and
# `trace` features are enabled: the metrics gauge sink (`otlp_push`) and the
# trace/span exporter (`otlp_spans`, over the ported `Traced`/`HasLatency`
# latency infrastructure) — see `src/adapters/otlp.rs`.
#
# NOTE — deliberate divergence from classic: next pins opentelemetry* 0.32 while
# classic still ships 0.28. This is to clear GHSA-w9wp-h8wv-79jx (opentelemetry_sdk
# < 0.29: unbounded allocation in W3C Baggage propagation), which the dependency-
# review gate flags on the newly added next dep. The 0.32 API is source-compatible
# with the adapter's usage (no code change needed). Classic should be bumped to
# match in a follow-up to restore lockstep and fix the same advisory there.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = [
    "metrics",
    "trace",
    "rt-tokio",
], optional = true }
opentelemetry-otlp = { version = "0.32", features = [
    "http-proto",
    "reqwest-blocking-client",
    "metrics",
    "trace",
], optional = true }

# `fix` feature: TLS for the FIX initiator (`rustls` with the `ring` provider +
# the Mozilla root bundle via `webpki-roots`) and a lock-free bounded MPSC
# (`kanal`) for the outbound inject channel. Versions mirror the classic
# `wingfoil` crate's `fix` adapter so the two trees don't drift.
rustls = { version = "0.23", features = ["ring"], optional = true }
webpki-roots = { version = "0.26", optional = true }
kanal = { version = "0.1.1", optional = true }

# `tracing` feature (and the `instrument-*` roll-ups): engine span
# instrumentation around `run`, the lifecycle phases, each cycle and — opt-in —
# each node. Optional so a default build carries no tracing dependency at all
# and the engine hot path is byte-identical to today's. Classic wingfoil takes
# `tracing` unconditionally (its `logged` tap routes through the `tracing`
# event macros); next's `logged` goes through `log` directly, so here the whole
# dependency can hang off the feature. `attributes` (the `#[tracing::instrument]`
# macro) is a tracing default feature, named explicitly because every use site
# here depends on it; `log` makes spans/events fall back to `log` records when
# no subscriber is installed, matching classic's dependency.
tracing = { workspace = true, features = ["log", "attributes"], optional = true }

[dev-dependencies]
# Compile-fail tests pinning the `nitro!` macro's key error paths.
trybuild = "1"
criterion = "0.8.1"
# The `latency_stages!` macro derives serde on the generated record, so a crate
# invoking it (here, the latency tests) needs serde in scope.
serde = { version = "1.0", features = ["derive"] }
# Subscriber for the `tracing` example's `log` mode — renders the `logged` op's
# `log`-crate records (target "wingfoil"). Mirrors the classic tracing example.
env_logger = { workspace = true }
# Subscriber for the `tracing` example's `tracing` / `instruments` modes and for
# the engine-instrumentation tests (which collect the emitted span names through
# a small custom `Layer`). Mirrors the classic tracing example's dev-dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# `tokio/sync` backs `consume_async`'s bounded/unbounded sink channels; it is
# part of the async module, so the feature enables it directly rather than
# relying on a companion adapter (etcd-client) to pull it in transitively.
async = ["dep:tokio", "dep:futures", "tokio/sync"]
# `async` + `async-stream` back the lazy, back-pressured `csv_read` replay
# source (a lazy `produce_async` + `buffer_size` producer streaming rows on
# demand, so a huge file is not read into memory up front). The sink stays synchronous.
csv = ["dep:csv", "dep:serde", "dep:serde-aux", "async", "dep:async-stream"]
# File-backed result cache. Reuses `async` for the tokio runtime and adds
# tokio's `fs` for the async file IO. Mirrors classic wingfoil's `kdb` deps
# (`sha2`, `bincode`, `async`, `tokio/fs`).
cache = ["dep:sha2", "dep:bincode", "dep:serde", "async", "tokio/fs"]
augurs = ["dep:augurs"]
etcd = ["dep:etcd-client", "dep:async-stream", "async"]
etcd-integration-test = ["etcd", "dep:testcontainers"]
# Redis Pub/Sub + Streams adapter. Built on `async` (produce_async source +
# consume_async sink) and `async-stream` (the snapshot→tail stream! macro).
redis = ["dep:redis", "dep:async-stream", "async"]
redis-integration-test = ["redis", "dep:testcontainers"]
# PostgreSQL adapter. Built on `async` (produce_async live tail + block_on
# reader/sink) and `async-stream` (the sub's `stream!` macro); `chrono` for the
# timestamp column conversions.
postgres = ["dep:tokio-postgres", "dep:chrono", "dep:async-stream", "async"]
postgres-integration-test = ["postgres", "dep:testcontainers"]
# Streaming Kafka consume source + produce sink. Built on the async
# `produce_async` / `consume_async` ergonomics; needs `async-stream` for the
# consumer's `recv()` loop. Mirrors classic wingfoil's `kafka` deps.
kafka = ["dep:rdkafka", "dep:async-stream", "async"]
kafka-integration-test = ["kafka", "dep:testcontainers"]
# Bidirectional WebSocket streaming to browsers: an axum HTTP/WS server plus
# the `web_pub` sink and `web_sub` source. Built on `async` (the `produce_async`
# source and `consume_async` sink ergonomics) and `async-stream` (the sub's
# `stream!` macro). Mirrors classic wingfoil's `web` deps.
web = [
    "async",
    "dep:serde",
    "dep:axum",
    "dep:tower-http",
    "dep:tokio-tungstenite",
    "dep:wingfoil-wire-types",
    "dep:bincode",
    "dep:async-stream",
    "tokio/net",
    "tokio/sync",
]
web-tls = ["web", "dep:axum-server", "dep:rustls", "dep:rustls-pemfile"]
# Pulls in `tokio-tungstenite/rustls-tls-webpki-roots` so the test client can
# speak `wss://`, plus `rcgen`/`scopeguard` for the self-signed cert fixture.
web-tls-integration-test = [
    "web-tls",
    "tokio-tungstenite/rustls-tls-webpki-roots",
    "dep:rcgen",
    "dep:scopeguard",
]
# Streaming Fluvio consume source + produce sink. Built on the async
# `produce_async` / `consume_async_bursts` ergonomics; needs `async-stream` for
# the consumer's record loop. Mirrors classic wingfoil's `fluvio` deps.
fluvio = ["dep:fluvio", "dep:async-stream", "async"]
fluvio-integration-test = [
    "fluvio",
    "dep:testcontainers",
    "dep:fluvio-controlplane-metadata",
]
# Aeron IPC/UDP transport. Enable exactly one backend: `aeron` (rusteron-client,
# production) or `aeron-rs` (pure Rust, experimental). `aeron-driver` embeds a
# media driver in-process and implies `aeron`. Synchronous/poll-based — no
# `async`. Mirrors classic wingfoil's `aeron` features.
aeron = ["dep:rusteron-client"]
aeron-rs = ["dep:aeron-rs"]
aeron-driver = ["aeron", "dep:rusteron-media-driver"]
# Live-media-driver tests (a testcontainers `aeronmd` bind-mounting /dev/shm).
# Enables both backends so their handle-construction paths are covered.
aeron-integration-test = ["aeron", "aeron-rs", "dep:testcontainers", "dep:libc"]
# Zero-copy IPC publish/subscribe over shared memory. Synchronous and
# poll-based (a busy-spin `custom_node`, a background thread over the `channel`
# layer, or an event-driven WaitSet), so — like classic — it does NOT pull in
# `async`. Mirrors classic wingfoil's `iceoryx2` deps.
# `wingfoil/iceoryx2` brings in the classic crate's `ZeroCopySend` impl for
# `Traced<T, L>`, so latency-stamped payloads cross an iceoryx2 hop (the classic
# adapter's latency round-trip test relies on the same impl).
iceoryx2 = ["dep:iceoryx2", "dep:thiserror", "wingfoil/iceoryx2"]
# Cross-process `Ipc`-variant tests (real shared memory under /dev/shm, no
# container). The in-process `Local`-variant tests need only `iceoryx2`.
iceoryx2-integration-test = ["iceoryx2"]
# KDB+/q adapter: time-partitioned historical reads (`kdb_read`,
# `kdb_read_cached`), a real-time tickerplant subscription (`kdb_sub`), and a
# streaming insert sink (`kdb_write`). Built on `async` (the `produce_async` /
# `consume_async` ergonomics, via `cache`), `async-stream` (the reader/sub
# `stream!` macros), `chrono` (the write timestamp column), and the `cache`
# feature (the file cache behind `kdb_read_cached`, which also supplies
# `sha2`/`bincode`/`serde`/`tokio/fs`). Mirrors classic wingfoil's `kdb` deps.
kdb = ["dep:kdb-plus-fixed", "dep:chrono", "dep:async-stream", "cache"]
# KDB+ cannot be run under `testcontainers` (no public, freely-licensed image),
# so the integration tests probe an externally-provided instance (KDB_TEST_HOST
# / KDB_TEST_PORT, default localhost:5000) and skip when unreachable — no
# container dependency, matching the classic adapter's `q -p 5000` setup.
kdb-integration-test = ["kdb"]
# Realtime pull-based Prometheus metrics sink (hand-rolled HTTP + `arc-swap`).
prometheus = ["dep:arc-swap"]
# Adds the end-to-end scrape test (a live Prometheus scraping the exporter);
# `reqwest` (blocking) queries Prometheus. Mirrors classic wingfoil.
prometheus-integration-test = ["prometheus", "dep:reqwest"]
# ZMQ pub/sub adapter. `bincode`/`serde` frame the wire envelope; the `zmq` crate
# links the system `libzmq`. No `async` — the subscriber uses a background thread
# over the `channel` layer (matching classic).
zmq = ["dep:zmq", "dep:bincode", "dep:serde"]
# Core pub/sub parity tests (real sockets, no external service / container).
zmq-integration-test = ["zmq"]
# etcd service-discovery parity tests (needs Docker via testcontainers). Enables
# the `etcd`-gated `EtcdRegistry` discovery backend alongside `zmq`.
zmq-etcd-integration-test = ["zmq", "etcd", "dep:testcontainers"]
# Realtime push-based OpenTelemetry (OTLP) metrics sink. Reuses `async` for the
# tokio runtime `consume_async` needs. Mirrors classic wingfoil's `otlp`.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "async",
]
# Adds the self-contained OTLP integration test (a testcontainers OTel collector
# the sink exports to). Mirrors classic wingfoil.
otlp-integration-test = ["otlp", "dep:testcontainers"]
# FIX (Financial Information eXchange) protocol adapter: a synchronous, poll-based
# session engine (initiator + acceptor, plain TCP or TLS) exposing inbound
# messages + session status as streams, a market-data subscription helper, and an
# outbound sender. Like classic wingfoil's `fix`, it is synchronous/poll-based and
# deliberately does NOT pull in `async`; `rustls`/`webpki-roots` back the TLS
# initiator and `kanal` backs the lock-free outbound inject channel. Versions
# mirror the classic `wingfoil` crate's `fix` adapter so the two trees don't drift.
fix = ["dep:rustls", "dep:webpki-roots", "dep:kanal", "dep:chrono"]
# The FIX adapter's cross-process parity tests spin up an in-process acceptor +
# initiator over real loopback sockets (no external service / container), so this
# gates the same-process integration tests. Mirrors classic wingfoil's
# `fix-integration-test` (which additionally reaches the LMAX demo when
# credentialed; those credentialed tests are not ported — see the module docs).
fix-integration-test = ["fix"]
# Runtime graph dynamism: append nodes and splice edges into a live graph
# mid-run (`Runner::run_dynamic` + `Extension`). Mirrors classic wingfoil's
# `dynamic-graph` feature; off the default hot path until wired in. The layered
# `(layer, index)` dispatch it relies on is always on (it is byte-identical to
# the old index order on static graphs).
dynamic-graph = []
# Engine span instrumentation, ported one-for-one from classic wingfoil
# (`wingfoil/Cargo.toml`). `tracing` alone pulls in the dependency without
# emitting anything; each `instrument-*` feature switches on one span site in
# `interp.rs`, so a build pays only for the spans it asks for and a build with
# none is byte-identical to an uninstrumented engine.
tracing = ["dep:tracing"]
# A span around `Runner::run` / `run_dynamic` — the whole start→cycles→stop→
# teardown lifecycle.
instrument-run = ["tracing"]
# A span around each engine cycle (one per dirty-node batch).
instrument-cycle = ["tracing"]
# A span around each lifecycle phase (start / stop / teardown) applied over all
# nodes, recording the phase name.
instrument-apply-nodes = ["tracing"]
# A span around graph initialisation (`Builder::build`).
instrument-initialise = ["tracing"]
# A span per node execution, recording the node index and label. High frequency
# — opt in deliberately.
instrument-cycle-node = ["tracing"]
instrument-default = [
    "instrument-run",
    "instrument-cycle",
    "instrument-apply-nodes",
    "instrument-initialise",
]
instrument-all = ["instrument-default", "instrument-cycle-node"]

[[example]]
name = "fluvio_admin"
required-features = ["fluvio-integration-test"]

[[example]]
name = "async_source"
required-features = ["async"]

[[example]]
name = "produce_async_feed"
required-features = ["async"]

# Port of the classic `async` example: an async `produce_async` producer driving
# the graph (the graph itself is the consumer). Needs tokio + futures.
[[example]]
name = "async"
path = "examples/async/main.rs"
required-features = ["async"]

# Observability: the `logged` debug tap rendered through `env_logger`. Ports the
# `log` mode of the classic `tracing` example (the `tracing`-subscriber and
# engine-span `instruments` modes await next's instrumentation-feature port).
[[example]]
name = "tracing"
path = "examples/tracing/main.rs"

[[bench]]
name = "tiers"
harness = false

[[bench]]
name = "custom_op"
harness = false

[[bench]]
name = "store_baseline"
harness = false

# The lines replay source is behind `async` (lazy `produce_async` +
# `buffer_size` replay, like csv); the example uses it, so it requires the feature.
[[example]]
