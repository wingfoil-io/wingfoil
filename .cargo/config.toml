# Cargo aliases that mirror what CI runs in `.github/workflows/rust-test.yml`.
# Run these before pushing to catch failures locally.
#
# Note: `lint-all` (and `cargo build --features full` / `cargo test --features
# full`) pull in dependencies that need `protoc` on the build machine. Install
# with `apt-get install -y protobuf-compiler` on Debian/Ubuntu, `brew install
# protobuf` on macOS.
#
# `legacy/` is its own workspace (see the `exclude` note in the root
# `Cargo.toml`), so the plain aliases no longer reach it. The `-legacy` pair
# below does. They are needed only when changing something under `legacy/`;
# ordinary next work does not build that tree at all, which is the point.
[alias]
lint     = "clippy --workspace --all-targets -- -D warnings"
lint-all = "clippy --workspace --all-targets --all-features -- -D warnings"

lint-legacy = "clippy --manifest-path legacy/Cargo.toml --workspace --all-targets -- -D warnings"
test-legacy = "test --manifest-path legacy/Cargo.toml --workspace"
