name: release

on:
  workflow_dispatch:
    inputs:
      registries:
        description: >-
          Which registries to publish to. `all` for a normal release; a single
          registry to finish a partial publish (see "Recovering a partial
          publish" in .github/workflows/README.md).
        type: choice
        default: all
        options:
          - all
          - crates
          - npm
          - pypi

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: Preflight — version check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version
        id: version
        run: |
          # Source of truth, matching release.bump.
          VERSION=$(grep -m 1 '^version' crates/wingfoil/Cargo.toml | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Fail if the published versions disagree
        run: |
          # release.bump moves all three together, so a mismatch means someone
          # edited one by hand. Catch it here rather than in the release notes,
          # which quote this one version as the install line for all three
          # registries — crates.io, PyPI and npm.
          VERSION="${{ steps.version.outputs.version }}"
          NPM_VERSION=$(node -p "require('./js/package.json').version")
          WASM_VERSION=$(grep -m 1 '^version' crates/wingfoil-wasm/Cargo.toml | awk -F'"' '{print $2}')
          if [ "$NPM_VERSION" != "$VERSION" ] || [ "$WASM_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch — wingfoil ${VERSION}, @wingfoil/client ${NPM_VERSION}, wingfoil-wasm ${WASM_VERSION}. Run release.bump to realign."
            exit 1
          fi

      - name: Fail if tag already exists
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Tag ${TAG} already exists. Bump the version before releasing."
            exit 1
          fi

  all-tests:
    name: All Tests
    needs: preflight
    uses: ./.github/workflows/all-tests.yml
    secrets: inherit

  # --- publish, THEN tag ---------------------------------------------------
  #
  # The three publish jobs used to `needs: tag`, which made a publish failure
  # unrecoverable: the tag was already pushed, so the `Fail if tag already
  # exists` preflight blocked every re-run of this workflow, and the only way
  # out was deleting a tag by hand.
  #
  # Nothing consumed the tag. Each publish job is a reusable workflow whose
  # `actions/checkout` takes the caller's ref — the dispatched commit — not the
  # tag, so they build byte-identical trees whether the tag exists or not. That
  # makes the ordering free to reverse, and reversing it is the whole fix: a
  # failed publish now leaves no tag behind, and re-dispatching the workflow
  # just works.
  #
  # The tag stays *before* `github-release`, which needs it to exist
  # (`gh release create --verify-tag`), and which was already gated on all
  # three registries for the same reason this reordering exists.
  publish-crates:
    name: Publish to crates.io
    needs: [preflight, all-tests]
    if: ${{ inputs.registries == 'all' || inputs.registries == 'crates' }}
    uses: ./.github/workflows/crates-publish.yml
    secrets: inherit

  publish-npm:
    name: Publish to npm
    needs: [preflight, all-tests]
    if: ${{ inputs.registries == 'all' || inputs.registries == 'npm' }}
    # id-token must be granted at the caller for OIDC to reach the reusable
    # workflow (reusable-workflow permissions are capped by the caller).
    #
    # This workflow file is also the one registered as the npm trusted
    # publisher, and that is not a free choice: npm validates the OIDC
    # `workflow_ref` claim, which under `workflow_call` names the *calling*
    # workflow, not the reusable one that runs `npm publish`. Registering
    # `npm-publish.yml` is what made every release fail here with ENEEDAUTH
    # while a direct dispatch of that same file, at the same commit, published
    # fine. PyPI matches the called workflow instead, which is why the
    # identically-shaped `publish-pypi` job never had this problem.
    #
    # The consequence for recovery: `npm-publish.yml` cannot be dispatched by
    # hand any more — it would present `npm-publish.yml` as the entry point and
    # fail to authenticate. Re-dispatch this workflow with `registries: npm`
    # instead, which is what the input above exists for.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit

  publish-pypi:
    name: Publish to PyPI
    needs: [preflight, all-tests]
    if: ${{ inputs.registries == 'all' || inputs.registries == 'pypi' }}
    # Same as publish-npm: PyPI trusted publishing is OIDC, and a reusable
    # workflow's permissions are capped by its caller, so the grant has to be
    # made here or the upload job cannot mint a token.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pypi-publish.yml
    secrets: inherit
    with:
      pypi-target: prod

  tag:
    name: Cut release tag
    # Only once every registry has the artifacts. A tag is a promise that the
    # version is installable; cutting it first turned a transient npm or PyPI
    # failure into a manual tag deletion before anyone could retry.
    #
    # The `if` is what lets a recovery run still reach the tag. A run with
    # `registries: npm` *skips* the other two publish jobs, and a skipped
    # `needs` would ordinarily skip this job along with it — so gate on
    # "nothing failed" rather than "everything ran". `all-tests` is in `needs`
    # purely so this can tell the two apart: if the suite goes red the publish
    # jobs skip too, and without that check a skipped-because-broken run would
    # look exactly like a skipped-because-not-asked-for one and get tagged.
    needs: [preflight, all-tests, publish-crates, publish-npm, publish-pypi]
    if: >-
      ${{ !cancelled()
      && needs.preflight.result == 'success'
      && needs.all-tests.result == 'success'
      && needs.publish-crates.result != 'failure'
      && needs.publish-npm.result != 'failure'
      && needs.publish-pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create and push tag
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  github-release:
    name: Publish GitHub release
    # Last, and only once every registry has the artifacts *and* the tag those
    # artifacts correspond to exists: the release is the announcement, and a
    # release pointing at versions that are not yet installable is worse than
    # no release at all.
    needs: [preflight, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # The install block, then GitHub's own generated changelog appended
          # underneath it. Generating through the API rather than
          # `gh release create --generate-notes` is what lets the two be
          # combined in a defined order.
          cat > notes.md <<'HEADER'
          ### Install
          HEADER
          cat >> notes.md <<EOF

          \`\`\`toml
          # Cargo.toml
          [dependencies]
          wingfoil = "$VERSION"
          \`\`\`

          \`\`\`sh
          pip install wingfoil==$VERSION
          npm install @wingfoil/client@$VERSION
          \`\`\`

          Published to [crates.io](https://crates.io/crates/wingfoil/$VERSION),
          [PyPI](https://pypi.org/project/wingfoil/$VERSION/) and
          [npm](https://www.npmjs.com/package/@wingfoil/client/v/$VERSION).

          EOF

          # Link the curated notes for this version when there is a page for
          # it, and the index otherwise — every release gets a working link,
          # and one that carries a page points straight at it.
          if [ -f "docs/release-notes/${VERSION}.md" ]; then
            NOTES_PATH="docs/release-notes/${VERSION}.md"
          else
            NOTES_PATH="docs/release-notes/"
          fi
          cat >> notes.md <<EOF
          What changed and how to upgrade:
          [release notes](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/${NOTES_PATH}).

          EOF
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=$TAG" --jq .body >> notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
