name: test.integration.augurs

# augurs is a pure-Rust compute library (no external service), so this workflow
# runs the in-crate unit tests behind `--features augurs`, the example, and the
# Python binding tests. There is no container to start and no `requires_*`
# marker — the Python tests run by default.

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'legacy/wingfoil/src/adapters/augurs/**'
      - 'legacy/wingfoil/examples/augurs/**'
      - 'legacy/wingfoil-python/src/py_augurs.rs'
      - 'legacy/wingfoil-python/tests/test_augurs.py'
      - '.github/workflows/augurs-integration.yml'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: augurs-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  augurs-integration:
    name: augurs Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-legacy
          # Legacy is its own workspace, so its artifacts land in
          # `legacy/target` (cutover-plan 5.0).
          workspaces: legacy

      - name: Run augurs unit tests
        run: |
          cargo test --manifest-path legacy/Cargo.toml --features augurs -p wingfoil \
            -- --nocapture adapters::augurs
        env:
          RUST_LOG: INFO

      - name: Run augurs example
        run: cargo run --manifest-path legacy/Cargo.toml -p wingfoil --example augurs --features augurs

      # --- Python bindings ---
      - name: Install protoc
        # wingfoil-python enables the etcd feature unconditionally, and
        # etcd-client's build script needs protoc to compile its proto files.
        run: sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: legacy/wingfoil-python/pyproject.toml

      - name: Install maturin and build Python bindings
        run: |
          python -m venv legacy/wingfoil-python/.venv
          legacy/wingfoil-python/.venv/bin/pip install maturin pytest
          cd legacy/wingfoil-python && .venv/bin/maturin develop

      - name: Run Python augurs tests
        run: |
          cd legacy/wingfoil-python && .venv/bin/pytest tests/test_augurs.py -v
