name: test.next-python

on:
  workflow_call:
  push:
    branches: [ "next", "main" ]
    paths:
      - "crates/wingfoil-python/**"
      - "crates/wingfoil-python-macros/**"
      - "crates/wingfoil/**"
  pull_request:
    branches: [ "next", "main" ]
    paths:
      - "crates/wingfoil-python/**"
      - "crates/wingfoil-python-macros/**"
      - "crates/wingfoil/**"
  workflow_dispatch:

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: next-python-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Next Python Interop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # protobuf-compiler: a transitive dep of the engine's feature graph.
        # patchelf: maturin uses it to build the extension module on Linux.
        # cmake/clang/uuid/bsd are for the **aeron** adapter, which joined
        # `all-adapters` when the wheel gained it (#367). Both steps below build
        # that roll-up, and aeron links a C library — without libbsd the link
        # fails with `unable to find library -lbsd`.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler patchelf clang libclang-dev uuid-dev libbsd-dev
          # aeron needs cmake >= 3.30 and Ubuntu 24.04 ships 3.28, so the apt
          # package is not enough — same recipe as aeron-next-integration.yml.
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-linux-x86_64.sh
          sudo sh cmake-3.31.0-linux-x86_64.sh --prefix=/usr/local --skip-license --exclude-subdir


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rust tests (boundary type, object form, wire_op1 seam, #[pyop] cross-crate)
        # Default features (extension-module OFF) so the auto-initialize
        # embedded-interpreter unit and integration tests link libpython and run.
        # These do not run in the rust-test leg, which is scoped to
        # `--manifest-path crates/wingfoil/Cargo.toml` / `--manifest-path crates/wingfoil/Cargo.toml`.
        #
        # `all-adapters` additionally covers the per-adapter `#[pyadapter]`
        # bindings and their marshaling tests, which are feature-gated off by
        # default. Adapters needing a system library at build time must stay out
        # of that roll-up (or be installed above) so this step keeps working.
        run: cargo test --manifest-path crates/wingfoil-python/Cargo.toml --features all-adapters

      - name: Build module and run pytest
        working-directory: crates/wingfoil-python
        # `-F all-adapters` rather than the `[tool.maturin] features` default:
        # each adapter binding carries a service-free pytest tier (names exposed,
        # argument defaults, wiring-time rejections), and those only run if the
        # module was built with that adapter. The pyproject list stays the
        # *packaging* decision for released wheels; this is the test build.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest
          .venv/bin/maturin develop -F all-adapters
          .venv/bin/pytest -q
