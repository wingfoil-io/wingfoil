name: test.integration.fix-next

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'next/crates/wingfoil-next/src/adapters/fix**'
      - 'next/crates/wingfoil-next/tests/fix_integration.rs'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: fix-next-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fix-next-integration:
    name: FIX (next) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Run FIX (next) same-process integration tests
        # Loopback TCP only — no external service or container. Serialized
        # (`--test-threads=1`) because the tests run against a live wall clock.
        run: |
          cargo test --features fix-integration-test -p wingfoil-next \
            --test fix_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO
