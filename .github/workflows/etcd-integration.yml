name: test.integration.etcd

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'legacy/wingfoil/src/adapters/etcd/**'
      - 'legacy/wingfoil-python/src/py_etcd.rs'
      - 'legacy/wingfoil-python/tests/test_etcd.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: etcd-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  etcd-integration:
    name: etcd Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull etcd image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes (e.g. "bytes remaining
        # on stream"). Pull once up front with retries so every test
        # reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull gcr.io/etcd-development/etcd:v3.5.0 && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull etcd image after 3 attempts" && exit 1

      - name: Run etcd integration tests
        run: |
          cargo test --features etcd-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture etcd::integration_tests
        env:
          RUST_LOG: INFO

      - name: Start etcd container for Python tests
        run: |
          docker run -d \
            --name etcd-py \
            -p 2379:2379 \
            -e ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379 \
            -e ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379 \
            gcr.io/etcd-development/etcd:v3.5.0
          for i in $(seq 1 30); do
            nc -z localhost 2379 && echo "etcd ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 2379 || (echo "etcd never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: legacy/wingfoil-python/pyproject.toml

      - name: Install maturin and build Python bindings
        run: |
          python -m venv legacy/wingfoil-python/.venv
          legacy/wingfoil-python/.venv/bin/pip install maturin pytest
          cd legacy/wingfoil-python && .venv/bin/maturin develop

      - name: Run Python etcd integration tests
        run: |
          cd legacy/wingfoil-python && .venv/bin/pytest -m requires_etcd tests/test_etcd.py -v
        env:
          RUST_LOG: INFO

      - name: Dump etcd logs on failure
        if: failure()
        run: docker logs etcd-py

      - name: Stop etcd container
        if: always()
        run: docker stop etcd-py && docker rm etcd-py
