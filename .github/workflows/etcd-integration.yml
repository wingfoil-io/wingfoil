name: test.integration.etcd

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/etcd-integration.yml'
      - 'crates/wingfoil/src/adapters/etcd**'
      - 'crates/wingfoil/tests/etcd_integration.rs'
      - 'crates/wingfoil-python/src/adapters/etcd.rs'
      - 'crates/wingfoil-python/tests/test_etcd.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/etcd-integration.yml'
      - 'crates/wingfoil/src/adapters/etcd**'
      - 'crates/wingfoil/tests/etcd_integration.rs'
      - 'crates/wingfoil-python/src/adapters/etcd.rs'
      - 'crates/wingfoil-python/tests/test_etcd.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: etcd-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Instrumented run is post-merge only; see README.md. Allow-list, not
  # `!= 'pull_request'`: under `workflow_call` the event is the caller's.
  WF_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Same condition again — `env` cannot reference itself here. Used unquoted
  # below, so it word-splits into the command and its flags.
  WF_CARGO_TEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'cargo llvm-cov --no-report' || 'cargo test' }}

jobs:
  etcd-integration:
    name: etcd Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install cargo-llvm-cov
        if: env.WF_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage collection
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull etcd image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes (e.g. "bytes remaining
        # on stream"). Pull once up front with retries so every test
        # reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull gcr.io/etcd-development/etcd:v3.5.0 && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull etcd image after 3 attempts" && exit 1

      - name: Run etcd integration tests
        # Just this binary — the shared suite is rust-test.yml's job.
        run: |
          $WF_CARGO_TEST --features etcd-integration-test -p wingfoil \
            --test etcd_integration -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # No `if: always()`: a half-run report would become this flag's baseline.
      - name: Export etcd coverage
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload etcd coverage to Codecov
        if: env.WF_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          flags: etcd
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # --- Python bindings (wingfoil-python) ---
      # The Rust tests above use testcontainers (per-test container); the Python
      # tests expect a fixed localhost:2379, so start one explicitly.
      - name: Start etcd container for Python tests
        # The same image the Rust tests use (pre-pulled above, so it is already
        # cached): the official etcd build, configured through the env vars its
        # entrypoint reads.
        run: |
          docker run -d \
            --name etcd-py \
            -p 2379:2379 \
            -e ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379 \
            -e ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379 \
            gcr.io/etcd-development/etcd:v3.5.0
          for i in $(seq 1 30); do
            nc -z localhost 2379 && echo "etcd ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 2379 || (echo "etcd never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        # `-F etcd` explicitly: the adapter is not in the default wheel feature
        # list (etcd-client needs protoc at build time).
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop -F etcd

      - name: Run Python etcd integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_etcd tests/test_etcd.py -v
        env:
          RUST_LOG: INFO

      - name: Dump etcd logs on failure
        if: failure()
        run: docker logs etcd-py

      - name: Stop etcd container
        if: always()
        run: docker rm -f etcd-py || true
