name: test.integration.web-next

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'crates/wingfoil/src/adapters/web/**'
      - 'crates/wingfoil/tests/web_adapter.rs'
      - 'crates/wingfoil-python/src/adapters/web.rs'
      - 'crates/wingfoil-python/tests/test_web.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: web-next-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web-next-integration:
    name: Web (next) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      # The server is in-process, so there is no container or external service.
      # `web-tls-integration-test` also covers the plain-HTTP suite and adds the
      # wss:// round trip against an rcgen-generated self-signed cert.
      - name: Run web (next) integration tests (plain + TLS)
        run: |
          cargo test --features web-tls-integration-test --manifest-path crates/wingfoil/Cargo.toml \
            --test web_adapter -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # --- Python bindings (wingfoil-python) ---
      # The server is in-process here too; `websockets` is the only extra, and
      # is what the `requires_web` marker gates.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the next Python bindings
        working-directory: crates/wingfoil-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest websockets
          .venv/bin/maturin develop

      - name: Run Python web (next) WebSocket round trips
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_web tests/test_web.py -v
        env:
          RUST_LOG: INFO
