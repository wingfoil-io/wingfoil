name: test.integration.kafka

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'crates/wingfoil/src/adapters/kafka**'
      - 'crates/wingfoil/tests/kafka_integration.rs'
      - 'crates/wingfoil-python/src/adapters/kafka.rs'
      - 'crates/wingfoil-python/tests/test_kafka.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: kafka-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  kafka-integration:
    name: kafka Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull Redpanda image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes. Pull once up front with
        # retries so every test reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull docker.redpanda.com/redpandadata/redpanda:v24.1.1 && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull Redpanda image after 3 attempts" && exit 1

      - name: Run kafka integration tests
        run: |
          cargo test --features kafka-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # --- Python bindings (wingfoil-python) ---
      # The Rust tests above use testcontainers (per-test container); the Python
      # tests expect a fixed localhost:9092, so start one explicitly.
      - name: Start Redpanda container for Python tests
        run: |
          docker run -d \
            --name kafka-py \
            -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v24.1.1 \
            redpanda start --overprovisioned --smp 1 --memory 1G \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://localhost:9092
          for i in $(seq 1 60); do
            nc -z localhost 9092 && echo "redpanda ready" && break
            echo "Waiting... ($i/60)"
            sleep 1
          done
          nc -z localhost 9092 || (echo "redpanda never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        # `-F kafka` explicitly: the adapter is not in the default wheel feature
        # list (librdkafka builds from source and costs minutes).
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop -F kafka

      - name: Run Python kafka integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_kafka tests/test_kafka.py -v
        env:
          RUST_LOG: INFO

      - name: Dump Redpanda logs on failure
        if: failure()
        run: docker logs kafka-py

      - name: Stop Redpanda container
        if: always()
        run: docker rm -f kafka-py || true
