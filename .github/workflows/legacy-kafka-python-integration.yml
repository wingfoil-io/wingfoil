name: test.integration.kafka-python-legacy

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'legacy/wingfoil-python/src/py_kafka.rs'
      - 'legacy/wingfoil-python/tests/test_kafka.py'
      - 'legacy/wingfoil/src/adapters/kafka/**'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: legacy-kafka-python-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  legacy-kafka-python-integration:
    name: Kafka Python (legacy) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        # etcd-client's build script needs protoc, and wingfoil-python's
        # Cargo.toml enables the etcd feature unconditionally via maturin.
        run: sudo apt-get install -y protobuf-compiler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv legacy/wingfoil-python/.venv
          legacy/wingfoil-python/.venv/bin/pip install maturin pytest

      - name: Build and install Python bindings
        run: |
          cd legacy/wingfoil-python
          .venv/bin/maturin develop

      - name: Run Kafka Python integration tests
        run: |
          cd legacy/wingfoil-python
          .venv/bin/pytest -m requires_kafka tests/test_kafka.py -v
