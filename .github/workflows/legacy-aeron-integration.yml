name: test.integration.aeron-legacy

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'legacy/wingfoil/src/adapters/aeron/**'
      - '.github/workflows/legacy-aeron-integration.yml'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: legacy-aeron-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  legacy-aeron-integration:
    name: Aeron (legacy) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-legacy
          # Legacy is its own workspace, so its artifacts land in
          # `legacy/target` (cutover-plan 5.0).
          workspaces: legacy

      # The Aeron FFI backends (rusteron-client / aeron-rs) build native code
      # via bindgen + CMake. Docker (for the testcontainers media driver) is
      # already present on ubuntu-latest.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev uuid-dev libbsd-dev

      # The Aeron sources bundled by rusteron-client require CMake >= 3.30,
      # which is newer than the version shipped on ubuntu-latest. Install 3.31
      # from Kitware, matching the project setup instructions in CLAUDE.md.
      - name: Install CMake 3.31
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-linux-x86_64.sh
          sudo sh cmake-3.31.0-linux-x86_64.sh --prefix=/usr/local --skip-license
          cmake --version

      # The suite starts an Aeron media driver in a container and shares the
      # CNC file via /dev/shm, so it must run single-threaded.
      - name: Run Aeron integration tests
        run: |
          cargo test --manifest-path legacy/wingfoil/Cargo.toml --features aeron-integration-test \
            -- --test-threads=1 --nocapture aeron::integration_tests
        env:
          RUST_LOG: INFO
