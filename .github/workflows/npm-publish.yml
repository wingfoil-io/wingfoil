name: publish.npm

# `workflow_call` only, deliberately — this workflow used to be dispatchable on
# its own as the npm recovery route, and that is exactly what broke releases.
# npm validates the OIDC `workflow_ref` claim, which names the workflow the run
# *entered* through, so a file reachable two ways can only ever match one
# trusted publisher. The registered publisher is `release.yml`, because that is
# the path a real release takes; a direct dispatch of this file would present
# `npm-publish.yml` as the entry point and die with ENEEDAUTH before publishing.
# To finish a partial publish, dispatch `release.yml` with `registries: npm`.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-pub

      - name: Install wasm-pack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: wasm-pack

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # >=10.12 required for npm OIDC trusted publishing
          version: 10

      # NB: do NOT pass `registry-url` here. setup-node's registry-url support
      # writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp
      # .npmrc and exports a placeholder NODE_AUTH_TOKEN. The npm client then
      # sees a (bogus) credential and uses token auth instead of OIDC trusted
      # publishing, which fails with a 404. With no token configured it uses
      # OIDC. The default registry is already registry.npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node >= 22.14 is required for npm OIDC trusted publishing.
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install JS deps
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Build wasm bundle
        working-directory: js
        run: pnpm run build:wasm

      - name: Build TypeScript
        working-directory: js
        run: pnpm run build:ts

      - name: Lint
        working-directory: js
        run: pnpm run lint

      # Publish preflight, not just CI hygiene: this workflow is dispatchable
      # on its own and is called by release.yml, so without this leg a tree
      # whose vitest suite is red could still reach npm. Runs after
      # `build:wasm`, which the tests need (they import `src/wasm/`).
      - name: Unit tests
        working-directory: js
        run: pnpm test

      # Sanity check: dist/wasm/ is the only path that survives both
      # npm-packlist's nested-.gitignore quirk *and* esm.sh's relative-import
      # canonicalisation (a `../` import out of `dist/` gets rewritten to
      # `https://esm.sh/<dir>/...` as if it were a top-level package). Verify
      # the packlist tarball actually contains the wasm bindings before we
      # publish — a missing wasm here means a broken release on npm.
      - name: Verify wasm files are packaged
        working-directory: js
        run: |
          set -euo pipefail
          tarball=$(pnpm pack --pack-destination /tmp 2>&1 | tail -n1)
          if ! tar tzf "$tarball" | grep -q 'dist/wasm/wingfoil_wasm_bg\.wasm$'; then
            echo "::error::publish tarball is missing dist/wasm/ — refusing to publish"
            tar tzf "$tarball"
            exit 1
          fi

      # Publish with the npm CLI, not pnpm: OIDC trusted publishing is only
      # implemented in npm (>= 11.5.1), not pnpm (see pnpm/pnpm#9812), so
      # `pnpm publish` falls through to ENEEDAUTH. Node 22 ships npm 10.x, so
      # upgrade npm first. Auth is handled by OIDC (id-token: write above); the
      # trusted publisher registered on npmjs.com for @wingfoil/client must be
      # wingfoil-io/wingfoil + **release.yml** — the caller, not this file; see
      # the note on the `on:` block above. No NPM_TOKEN needed, and provenance
      # is emitted automatically.
      #
      # A token would work from any entry point and is therefore tempting as a
      # fix for the above, but it is the wrong direction: npm is restricting
      # 2FA-bypassing tokens for direct publishing and now points CI at trusted
      # publishing instead (gh.io/npm-gat-bypass2fa-deprecation), granular
      # tokens expire on a 90-day rotation, and provenance stops being
      # automatic.
      #
      # Pin to the 11.x line rather than @latest: npm 12.0.0 (now @latest)
      # ships a broken bundle whose libnpmpublish/provenance.js cannot resolve
      # `sigstore`, so `npm publish --provenance` dies with "Cannot find module
      # 'sigstore'" (npm/cli#9722). The 11.x line still bundles sigstore and
      # supports OIDC trusted publishing (>= 11.5.1).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        working-directory: js
        run: npm publish --access public
