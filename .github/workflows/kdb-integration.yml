name: test.integration.kdb

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "crates/wingfoil/src/adapters/kdb**"
      - "crates/wingfoil/src/adapters/cache.rs"
      - "crates/wingfoil/src/adapters/common.rs"
      - "crates/wingfoil/tests/kdb_integration.rs"
      - "crates/wingfoil-python/src/adapters/kdb.rs"
      - "crates/wingfoil-python/tests/test_kdb.py"

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: kdb-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  kdb-integration:
    name: KDB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      # KDB+ has no public, freely-licensed image, so we build our own and the
      # tests probe that instance (skipping if unreachable — but in CI it must
      # be present). The licence itself comes from the KDB_LICENSE_B64 secret.
      - name: Build KDB image
        run: docker build -t wingfoil-kdb crates/wingfoil/src/adapters/kdb/docker/

      - name: Start KDB container
        run: |
          echo "${{ secrets.KDB_LICENSE_B64 }}" | base64 -d > /tmp/kc.lic
          docker run -d \
            --name kdb \
            -p 5000:5000 \
            -e QLIC=/q \
            -v /tmp/kc.lic:/q/kc.lic \
            wingfoil-kdb

      - name: Wait for KDB to be ready
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5000 && echo "KDB ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 5000 || (echo "KDB never became ready" && exit 1)

      - name: Run KDB integration tests
        env:
          KDB_TEST_HOST: localhost
          KDB_TEST_PORT: 5000
          RUST_LOG: INFO
        run: |
          cargo test --features kdb-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture

      # --- Python bindings (wingfoil-python) ---
      # The same container serves both legs: the Rust tests probe
      # KDB_TEST_HOST/PORT and the Python ones default to localhost:5000.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf protobuf-compiler

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop

      - name: Run Python KDB integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_kdb tests/test_kdb.py -v
        env:
          KDB_TEST_HOST: localhost
          KDB_TEST_PORT: 5000
          RUST_LOG: INFO

      - name: Dump KDB logs on failure
        if: failure()
        run: docker logs kdb

      - name: Stop KDB container
        if: always()
        run: docker stop kdb && docker rm kdb
