name: test.cache-secret-audit

# Tests for the `actions/cache-secret-audit` composite action, then the action
# as a gate over this repository's own workflows (R1/R3/R4 fail, R2 warns).
on:
  push:
    branches: [ "main" ]
    paths:
      - "actions/cache-secret-audit/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "actions/cache-secret-audit/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-secret-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.10", "3.11", "3.12", "3.13" ]
    defaults:
      run:
        working-directory: actions/cache-secret-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3" "pytest==9.1.1"
      - run: python -m pytest -q

  action:
    name: action (uses ./)
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `uses: ./` on purpose: this job tests the action exactly as the checked-out
    # tree has it, the same path a consumer's local copy would take.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Clean fixtures must pass
        uses: ./actions/cache-secret-audit # zizmor: ignore[self-repository]
        with:
          path: actions/cache-secret-audit/tests/fixtures/pass
      # A gate on this repository, not a test of the action: secrets reaching
      # cargo or job-level env (R1/R3/R4) fail the build. R2 (PR runs can
      # write the cache) is reported as warnings until the legs gain save-if.
      - name: Audit this repository's workflows
        uses: ./actions/cache-secret-audit # zizmor: ignore[self-repository]
        with:
          path: .github/workflows
          min-severity: high
