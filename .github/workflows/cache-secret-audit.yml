name: security.cache-secret-audit

# Fails if a secret can reach a PR-readable build cache: a secret in job-level
# env, or in scope of a step that runs cargo (the Miri target/ disclosure).
# PR runs that can write the cache are reported as warnings.
# https://github.com/wingfoil-io/cache-secret-audit
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-secret-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Cache secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: wingfoil-io/cache-secret-audit@81a5c940a8227f13fee80d1fd0a784a0d52468bd # v0.1.0
