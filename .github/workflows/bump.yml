name: release.bump

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version bump type (major, minor, or patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WF_REBASE_PAT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-edit

      - name: Compute new version
        id: bump_cargo
        run: |
          BUMP_TYPE="${{ github.event.inputs['bump-type'] }}"
          CARGO_VERSION=$(grep -m 1 '^version' legacy/wingfoil/Cargo.toml | awk -F'"' '{print $2}')
          NPM_VERSION=$(node -p "require('./js/package.json').version")
          WASM_VERSION=$(grep -m 1 '^version' crates/wingfoil-wasm/Cargo.toml | awk -F'"' '{print $2}')
          BASE=$(printf '%s\n%s\n%s\n' "$CARGO_VERSION" "$NPM_VERSION" "$WASM_VERSION" | sort -V | tail -n 1)
          IFS='.' read -r MAJ MIN PATCH <<< "$BASE"
          case "$BUMP_TYPE" in
            major) MAJ=$((MAJ + 1)); MIN=0; PATCH=0 ;;
            minor) MIN=$((MIN + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "unknown bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac
          NEW_VERSION="${MAJ}.${MIN}.${PATCH}"
          echo "Cargo: $CARGO_VERSION, npm: $NPM_VERSION, wasm: $WASM_VERSION, base: $BASE, new: $NEW_VERSION"
          # Legacy first, root second — order is load-bearing. `legacy/` is its
          # own workspace now (cutover-plan 5.0) and `set-version` runs
          # `cargo metadata`, so it has to resolve while the tree is still
          # internally consistent. Bumping the root first would leave
          # `wingfoil-wire-types` at NEW against legacy's `^OLD` pin and the
          # resolve would fail — the same trap the wasm step below documents.
          cargo set-version --manifest-path legacy/Cargo.toml "$NEW_VERSION"
          cargo set-version "$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Re-pin legacy's cross-workspace dependency
        run: |
          NEW_VERSION="${{ steps.bump_cargo.outputs.new_version }}"
          # `set-version` re-pins dependencies on packages it bumped, and
          # `wingfoil-wire-types` is not a legacy member — it lives in the root
          # workspace, so legacy's pin on it is left on the old requirement.
          # Sed it, like the wasm crate's below.
          sed -i -E "s|(wingfoil-wire-types = \\{ path = \"\\.\\./\\.\\./crates/wingfoil-wire-types\", version = \")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${NEW_VERSION}\\2|" \
            legacy/wingfoil/Cargo.toml
          grep -n 'wingfoil-wire-types' legacy/wingfoil/Cargo.toml

      - name: Bump wingfoil-wasm (excluded from workspace)
        run: |
          NEW_VERSION="${{ steps.bump_cargo.outputs.new_version }}"
          WASM_TOML="crates/wingfoil-wasm/Cargo.toml"
          # `cargo set-version --manifest-path` is not usable here: it runs
          # `cargo metadata` first, which refuses to resolve when the existing
          # path-dep pin (wingfoil-wire-types = "^OLD") doesn't match the
          # already-bumped workspace member (NEW). Sed-bump both lines
          # directly — pure text edit, no resolver involvement.
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s||version = \"${NEW_VERSION}\"|" "$WASM_TOML"
          sed -i -E "s|(wingfoil-wire-types = \\{ path = \"\\.\\./wingfoil-wire-types\", version = \")[0-9]+\\.[0-9]+\\.[0-9]+(\")|\\1${NEW_VERSION}\\2|" "$WASM_TOML"

      - name: Update conf.py with new version
        run: |
          NEW_VERSION="${{ steps.bump_cargo.outputs.new_version }}"
          CONF_PATH="legacy/wingfoil-python/docs/conf.py"
          sed -i "s/^release = .*/release = '$NEW_VERSION'/" $CONF_PATH

      - name: Bump wingfoil-js package.json version
        working-directory: js
        run: npm version --no-git-tag-version ${{ steps.bump_cargo.outputs.new_version }}

      - name: Update latency_e2e importmap pin
        run: |
          NEW_VERSION="${{ steps.bump_cargo.outputs.new_version }}"
          # Both trees carry a copy of the demo while legacy exists.
          for INDEX_HTML in \
            crates/wingfoil/examples/latency_e2e/static/index.html \
            legacy/wingfoil/examples/latency_e2e/static/index.html; do
            sed -i -E "s|(esm\.sh/@wingfoil/client@)[0-9]+\.[0-9]+\.[0-9]+|\1${NEW_VERSION}|g" "$INDEX_HTML"
          done

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "bump: ${{ github.event.inputs['bump-type'] }} version to ${{ steps.bump_cargo.outputs.new_version }}"

      - name: Push changes
        run: git push
