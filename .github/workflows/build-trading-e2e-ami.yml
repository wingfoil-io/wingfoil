# Build the baked AMI used by the wingfoil trading_e2e ec2-spot Pulumi stack.
#
# The Packer template at
# `crates/wingfoil/examples/showcase/trading_e2e/pulumi/ec2-spot/packer/wingfoil-latency.pkr.hcl`
# bakes Docker, the demo's docker-compose.yml, and pre-pulled copies of the
# five service images into an Amazon Linux 2023 AMI. Result: a Spot reclaim
# recovers in ~60-90s instead of ~5min (no apt install, no image pulls).
#
# Triggers: manual dispatch only. Run `trading-e2e.build.images` first so the
# image tag you bake into the AMI actually exists in ECR.
#
# After the build, the resulting AMI ID is published to:
#   - SSM Parameter Store at /wingfoil/latency-e2e/ec2-spot/ami_id (so
#     `pulumi config set ami_id $(aws ssm get-parameter ...)` works)
#   - The workflow run summary (for humans)
#   - An uploaded artifact (`packer-manifest.json`)
#
# Required GitHub secrets (shared with build-trading-e2e-images.yml):
#   - AWS_ROLE_TO_ASSUME  IAM role allowed to:
#       - Build AMIs (ec2:* on AMI/snapshot/instance lifecycle)
#       - Pull from ECR (ecr:GetAuthorizationToken, ecr:BatchGetImage etc.)
#       - Write SSM parameter /wingfoil/latency-e2e/ec2-spot/ami_id
#   - AWS_REGION  (optional, default eu-west-2) — single region for the AMI
#                 build, ECR images, and the ec2-spot stack (LMAX LD4 in
#                 London). AMIs are region-scoped, so this must match
#                 `pulumi/ec2-spot/Pulumi.yaml`'s aws:region default.

name: trading-e2e.build.ami

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to bake into the AMI (default: latest)"
        required: false
        default: "latest"
      instance_type:
        description: >-
          EC2 instance type for the Packer builder. Default `c6in.large` is
          network-optimised (up to 25 Gbps) and finishes near the ~3-4 min
          floor; on AWS Free-plan accounts override to a free-tier-eligible
          type (e.g. `t3.micro`, much slower) since Free rejects non-free-
          tier launches.
        required: false
        default: "c6in.large"

env:
  # Single region for AMI build + ECR pulls + ec2-spot stack launch (London,
  # near LMAX LD4). AMIs are region-scoped, so this must match
  # `pulumi/ec2-spot/Pulumi.yaml`'s aws:region default.
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
  IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
  INSTANCE_TYPE: ${{ inputs.instance_type || 'c6in.large' }}
  SSM_AMI_PARAM: /wingfoil/latency-e2e/ec2-spot/ami_id

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: crates/wingfoil/examples/showcase/trading_e2e/pulumi/ec2-spot/packer
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Packer uploads `static/` from this checkout to /opt/wingfoil/static,
      # which compose bind-mounts *over* /app/static in the ws_server
      # container (install.sh, so the UI can be iterated without rebuilding
      # the image). That overlay means the AMI — not the image — is what
      # actually serves the page, so the vendored browser dependencies must
      # be built here too. Building only the image would leave a vendor-less
      # overlay shadowing a correct image, and the page would come up blank.
      #
      # NB: the job's default working-directory is the packer dir, so these
      # steps set it back to the repo root explicitly.
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-pub

      - name: Install wasm-pack
        working-directory: ${{ github.workspace }}
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Build demo vendor bundle
        working-directory: ${{ github.workspace }}
        run: scripts/build-demo-vendor.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          {
            echo "registry=${REGISTRY}"
            echo "ws_server=${REGISTRY}/wingfoil/ws-server:${IMAGE_TAG}"
            echo "fix_gw=${REGISTRY}/wingfoil/fix-gw:${IMAGE_TAG}"
            echo "prometheus=${REGISTRY}/wingfoil/prometheus:${IMAGE_TAG}"
            echo "tempo=${REGISTRY}/wingfoil/tempo:${IMAGE_TAG}"
            echo "grafana=${REGISTRY}/wingfoil/grafana:${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: 1.11.2

      - name: Packer init
        env:
          # Authenticate plugin downloads against the GitHub API. Anonymous
          # requests share a low IP-pool quota and intermittently hit 403
          # ("API rate limit exceeded"); the workflow's GITHUB_TOKEN bumps
          # the limit to 5000 req/h and is available on every run.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init wingfoil-latency.pkr.hcl

      # Fetch the ECR auth token on the runner (which has AWS creds via OIDC)
      # and forward it to Packer. The provisioner uses this to `docker login`
      # on the build instance — the instance has no IAM role, so calling
      # `aws ecr get-login-password` from inside install.sh would fail with
      # "Unable to locate credentials".
      - name: Packer build
        env:
          PKR_VAR_region: ${{ env.AWS_REGION }}
          PKR_VAR_image_tag: ${{ env.IMAGE_TAG }}
          PKR_VAR_instance_type: ${{ env.INSTANCE_TYPE }}
          PKR_VAR_ecr_registry: ${{ steps.ecr.outputs.registry }}
          PKR_VAR_ws_server_image: ${{ steps.ecr.outputs.ws_server }}
          PKR_VAR_fix_gw_image: ${{ steps.ecr.outputs.fix_gw }}
          PKR_VAR_prometheus_image: ${{ steps.ecr.outputs.prometheus }}
          PKR_VAR_tempo_image: ${{ steps.ecr.outputs.tempo }}
          PKR_VAR_grafana_image: ${{ steps.ecr.outputs.grafana }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_PASSWORD"
          PKR_VAR_ecr_password="$ECR_PASSWORD" packer build wingfoil-latency.pkr.hcl

      - name: Extract AMI ID
        id: ami
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)
          if [ -z "${AMI_ID}" ] || [ "${AMI_ID}" = "null" ]; then
            echo "Failed to extract AMI ID from packer-manifest.json" >&2
            exit 1
          fi
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish AMI ID to SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "${SSM_AMI_PARAM}" \
            --value "${{ steps.ami.outputs.ami_id }}" \
            --type String \
            --overwrite \
            --region "${AWS_REGION}"

      - name: Upload Packer manifest
        uses: actions/upload-artifact@v4
        with:
          name: packer-manifest
          path: crates/wingfoil/examples/showcase/trading_e2e/pulumi/ec2-spot/packer/packer-manifest.json

      - name: Summary
        run: |
          {
            echo "## Baked AMI"
            echo ""
            echo "- **AMI ID**: \`${{ steps.ami.outputs.ami_id }}\`"
            echo "- **Region**: \`${AWS_REGION}\`"
            echo "- **Image tag**: \`${IMAGE_TAG}\`"
            echo "- **SSM parameter**: \`${SSM_AMI_PARAM}\`"
            echo ""
            echo "Wire it into the Pulumi stack:"
            echo ""
            echo "\`\`\`bash"
            echo "cd crates/wingfoil/examples/showcase/trading_e2e/pulumi/ec2-spot"
            echo "pulumi config set ami_id ${{ steps.ami.outputs.ami_id }}"
            echo "pulumi up"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
