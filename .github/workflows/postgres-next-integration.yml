name: test.integration.postgres-next

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'next/crates/wingfoil-next/src/adapters/postgres**'
      - 'next/crates/wingfoil-next/src/adapters/common.rs'
      - 'next/crates/wingfoil-next/tests/postgres_integration.rs'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  postgres-next-integration:
    name: postgres (next) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull postgres image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes. Pull once up front with
        # retries so every test reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull postgres image after 3 attempts" && exit 1

      - name: Run postgres (next) integration tests
        run: |
          cargo test --features postgres-integration-test -p wingfoil-next \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO
