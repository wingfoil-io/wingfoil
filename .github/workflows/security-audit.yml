name: security.audit

# Fails CI when a dependency with a known security advisory enters the tree,
# mirroring the advisory databases GitHub Dependabot uses (RustSec for Cargo,
# the GitHub Advisory Database for npm). Runs on every push/PR to main and on a
# weekly schedule so advisories disclosed against *existing* deps (how the
# hickory/pyo3 alerts arose) are caught even without a code change.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Mondays 06:00 UTC — catch newly disclosed advisories against pinned deps.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main is not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Rust: scan Cargo.lock against the RustSec advisory DB. `cargo audit` exits
  # non-zero on vulnerabilities only; informational "unmaintained"/"unsound"
  # warnings (which have no fixed version) are reported but do not fail CI.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # No build needed — cargo-audit only reads Cargo.lock.
      - name: Audit Rust dependencies
        run: cargo audit

  # JavaScript: audit the wingfoil-js dependency tree. Fails on moderate+
  # advisories, matching the severities Dependabot surfaced for this package.
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Audit JS dependencies
        working-directory: js
        run: pnpm audit --audit-level moderate

  # PR-only: block a pull request that *introduces* a dependency with a known
  # vulnerability, using the same GitHub Advisory Database as Dependabot.
  # Requires the repository's dependency graph to be enabled (default for
  # public repos).
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # GHSA-6w46-j5rx-g56g (pytest, vulnerable tmpdir handling) does not
          # reach anyone through the published package. pytest is a `dev` extra,
          # so `pip install wingfoil` never pulls it — the wheel's only runtime
          # dependency is pandas — and `uv.lock`, where the advisory is found, is
          # a local dev-environment lockfile that neither pip nor CI reads.
          #
          # It cannot be resolved by upgrading either: the advisory covers every
          # pytest below 9.0, and pytest 9 requires Python >= 3.10, so clearing it
          # honestly would mean dropping 3.8 *and* 3.9 support from the library to
          # patch a tool that is not shipped.
          #
          # `fail-on-scopes` is not the lever it looks like — it already defaults
          # to `runtime`, and GitHub's dependency graph scopes this entry as
          # runtime anyway, because it parses `uv.lock` as one flat resolution and
          # cannot see the `dev` group in pyproject.toml.
          #
          # Remove this once the floor reaches 3.10 and the lock resolves pytest 9
          # everywhere on its own.
          allow-ghsas: GHSA-6w46-j5rx-g56g
