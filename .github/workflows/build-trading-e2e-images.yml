# Build and push the five trading_e2e container images to ECR.
#
# Manual dispatch only — image rebuilds are deliberate, not implicit on every
# push to main. ECR repositories (wingfoil/<name>) are created idempotently on
# first run, so no separate bootstrap step is needed.
#
# Required GitHub secrets (also used by build-trading-e2e-ami.yml and
# deploy-trading-e2e.yml):
#   - AWS_ROLE_TO_ASSUME  IAM role with ecr:* on wingfoil/* repositories
#   - AWS_REGION          (optional, defaults to eu-west-2)
#
# After this workflow runs, deploy-trading-e2e.yml can pull <registry>/wingfoil/<name>:latest.

name: trading-e2e.build.images

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ws-server
            dockerfile: crates/wingfoil/examples/showcase/trading_e2e/Dockerfile.ws_server
          - name: fix-gw
            dockerfile: crates/wingfoil/examples/showcase/trading_e2e/Dockerfile.fix_gw
          - name: prometheus
            dockerfile: crates/wingfoil/examples/showcase/trading_e2e/Dockerfile.prometheus
          - name: tempo
            dockerfile: crates/wingfoil/examples/showcase/trading_e2e/Dockerfile.tempo
          - name: grafana
            dockerfile: crates/wingfoil/examples/showcase/trading_e2e/Dockerfile.grafana
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The ws_server image serves the demo page, whose browser dependencies
      # are vendored into static/vendor/ rather than fetched from a CDN at
      # page load. That directory is generated and gitignored, so it has to
      # be built into the context before `docker build`; Dockerfile.ws_server
      # fails the build if it is absent. Only this one image needs it — the
      # other four are config-only images built from the same context.
      - name: Install Rust Toolchain
        if: matrix.name == 'ws-server'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust Build Artifacts
        if: matrix.name == 'ws-server'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-pub

      - name: Install wasm-pack
        if: matrix.name == 'ws-server'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        if: matrix.name == 'ws-server'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: matrix.name == 'ws-server'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Build demo vendor bundle
        if: matrix.name == 'ws-server'
        run: scripts/build-demo-vendor.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "wingfoil/${{ matrix.name }}" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name "wingfoil/${{ matrix.name }}" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/wingfoil/${{ matrix.name }}:latest
            ${{ steps.ecr-login.outputs.registry }}/wingfoil/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          {
            echo "## Image pushed: \`wingfoil/${{ matrix.name }}\`"
            echo ""
            echo "- \`${{ steps.ecr-login.outputs.registry }}/wingfoil/${{ matrix.name }}:latest\`"
            echo "- \`${{ steps.ecr-login.outputs.registry }}/wingfoil/${{ matrix.name }}:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
