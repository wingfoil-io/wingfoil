name: test.integration.prometheus

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'crates/wingfoil/src/adapters/prometheus**'
      - 'crates/wingfoil/tests/prometheus_integration.rs'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: prometheus-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prometheus-integration:
    name: Prometheus Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Start Grafana + Prometheus stack
        # The telemetry example's stack: same Prometheus config, scraping
        # WINGFOIL_METRICS_PORT (9091) on the host. These tests read Prometheus
        # only — Grafana comes up unused.
        run: docker compose up -d
        working-directory: crates/wingfoil/examples/adapters/telemetry/docker

      - name: Wait for Prometheus to be healthy
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:9090/-/healthy > /dev/null; then
              echo "Prometheus is up"
              break
            fi
            echo "Waiting for Prometheus... ($i/12)"
            sleep 5
          done
          curl -sf http://localhost:9090/-/healthy || (echo "Prometheus never became healthy" && exit 1)

      - name: Run Prometheus integration tests
        run: |
          cargo test --features prometheus-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO
          PROMETHEUS_TEST_URL: http://localhost:9090
          WINGFOIL_METRICS_PORT: "9091"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
        working-directory: crates/wingfoil/examples/adapters/telemetry/docker

      - name: Tear down stack
        if: always()
        run: docker compose down
        working-directory: crates/wingfoil/examples/adapters/telemetry/docker
