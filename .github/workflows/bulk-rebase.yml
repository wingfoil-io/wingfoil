name: maintenance.bulk-rebase
on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Exact branch names, separated by spaces (no patterns; main is excluded)'
        required: true
        type: string
jobs:
  rebase-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Unlike release.bump and maintenance.fmt, this job keeps the PAT in
      # `.git/config` for its whole run: the loop below pushes on every
      # iteration, and nothing here builds or executes repository content —
      # only git plumbing runs, so there is no third-party code in the job to
      # read the credential. Do not add a build step without moving the PAT to
      # the push, as those two workflows do.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WF_REBASE_PAT }}
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Rebase selected branches
        env:
          BRANCHES: ${{ inputs.branches }}
        run: |
          # Validate the whole selection before changing any branch. Pass input
          # through the environment, never interpolate it into shell source.
          IFS=$' \t\r\n' read -r -a branches <<< "${BRANCHES//$'\n'/ }"
          if (( ${#branches[@]} == 0 )); then
            echo 'Select at least one branch.' >&2
            exit 1
          fi
          for branch in "${branches[@]}"; do
            if [[ "$branch" == main || "$branch" == HEAD || "$branch" == -* ]] \
              || ! git check-ref-format "refs/heads/$branch" \
              || ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              printf 'Invalid or unavailable branch: %s\n' "$branch" >&2
              exit 1
            fi
          done

          for branch in "${branches[@]}"; do
            echo "Processing $branch..."
            git checkout --detach "refs/remotes/origin/$branch"
            if git rebase refs/remotes/origin/main; then
              # --force-with-lease is safer than --force
              git push origin "HEAD:refs/heads/$branch" --force-with-lease
              echo "Successfully rebased and pushed $branch"
            else
              echo "Conflict on $branch. Aborting rebase."
              git rebase --abort
            fi
          done
