name: test.rust

on:
  workflow_call:
  # No `paths-ignore: .github/workflows/**` here. It meant a change to this
  # file was the one change CI never validated — a broken gate only showed up
  # after it had merged. The legs below are parallel and cancel superseded PR
  # pushes, so paying for the run on a workflow edit is cheap.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# One in-flight run per ref. Superseded PR pushes are cancelled (the older
# result is worthless once a new commit lands); pushes to main are not,
# so every merged commit keeps a status of its own. The group name is a
# literal, not ${{ github.workflow }}: when this workflow is reached through
# `workflow_call` (from test.all) that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

# The three jobs below were one serial job ("Build, Test, & Lint") that took
# ~17 minutes. They share no artifacts in practice — coverage builds into
# `target/llvm-cov-target` with `-C instrument-coverage`, the wingfoil tests
# build a third feature set — so running them in parallel costs a little extra
# runner time and roughly halves wall clock. Each keeps its own cargo cache
# (`shared-key`) because each holds a different feature set's artifacts.

# **The one push these legs skip**, and why it is a job-level `if` rather than
# a `paths-ignore`: `release.bump` pushes straight to main with the message
# `bump: <type> version to <x.y.z>`, and that commit rewrites version strings
# and nothing else — four full Rust builds prove nothing about it, and the
# release workflow rebuilds the same tree from scratch minutes later anyway.
#
# A `paths-ignore` is the wrong instrument for that: it would have to name
# every path the bump touches (`**/Cargo.toml` among them), which would also
# hide real dependency changes, and the note at the top of this file is a
# standing ruling against reaching for one here. The guard below is narrow
# instead — it matches the bot's exact message shape, on `push` only.
#
# On `pull_request` and under `workflow_call` there is no `head_commit`, the
# expression short-circuits on `github.event_name`, and every leg runs. So a
# PR that happens to be titled "bump: …" is unaffected, and so is the release
# workflow, which reaches these legs through test.all.

jobs:
  test-legacy:
    name: Test (legacy) & Coverage
    if: >-
      ${{ github.event_name != 'push'
      || !(startsWith(github.event.head_commit.message, 'bump: ')
      && contains(github.event.head_commit.message, ' version to ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test-legacy-coverage
          # This job builds the legacy workspace, whose target dir is
          # `legacy/target` (cutover-plan 5.0) — the cache action needs telling,
          # or it saves and restores an empty root `target/`.
          workspaces: legacy
          # Only main writes the cache. Otherwise every PR branch races to
          # save a multi-GB entry, and the repo's 10GB cache budget evicts the
          # warm entries everything else restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake clang libclang-dev uuid-dev libbsd-dev

      - name: Run tests with coverage
        # Restrict to --lib --tests: the 33 example binaries each statically link
        # the entire `full` dependency tree, and linking them all under coverage
        # instrumentation exhausts the runner's disk (lld dies with SIGBUS writing
        # past EOF on its mmap'd output). Examples run no tests, so they add zero
        # coverage; they are still compile-checked by the clippy --all-targets step.
        #
        # `--no-capture` forces `--test-threads=1` in nextest, so these 500+ tests
        # run serially. That is deliberate: they take 30s either way, and several
        # bind loopback sockets, so the parallelism is not worth the flake risk.
        #
        # `--manifest-path legacy/Cargo.toml`: the legacy tree is its own
        # workspace (cutover-plan 5.0), so `--manifest-path crates/wingfoil/Cargo.toml` no longer resolves
        # from the root. Coverage lands in `legacy/target/llvm-cov-target`;
        # `lcov.info` is still written relative to the working directory, so
        # the upload step below is unchanged.
        run: cargo llvm-cov nextest --manifest-path legacy/wingfoil/Cargo.toml --features full --lib --tests --no-capture --lcov --output-path lcov.info
        env:
          RUST_LOG: INFO

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test:
    name: Test (wingfoil)
    # Skips the release.bump commit — see the note above `jobs:`.
    if: >-
      ${{ github.event_name != 'push'
      || !(startsWith(github.event.head_commit.message, 'bump: ')
      && contains(github.event.head_commit.message, ' version to ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake clang libclang-dev uuid-dev libbsd-dev

      - name: Run wingfoil tests
        # The coverage job is scoped to `--manifest-path crates/wingfoil/Cargo.toml`, so the wingfoil crate's
        # tests — the adapter parity suites (lines/csv/augurs) and the trybuild
        # cases — would otherwise never execute in CI. Run them here with all
        # features so the feature-gated csv/augurs adapters are exercised.
        # `--lib --tests` skips the example binaries (already compile-checked by
        # the workspace clippy job).
        #
        # nextest, not `cargo test`: `cargo test` runs one test *binary* at a
        # time, and wingfoil has ~70 of them.
        #
        # The `*_integration` binaries are compiled (so they stay type- and
        # link-checked) but not run here. Each has a dedicated workflow that
        # first stands up the service it needs — a KDB+ container, an etcd
        # container, an Aeron media driver. Without those services they only
        # exercise their connection-timeout paths, and they are slow doing it:
        # `aeron_integration` alone spent 1m46s of a 3m17s test run sleeping
        # through timeouts.
        run: |
          cargo nextest run --manifest-path crates/wingfoil/Cargo.toml --all-features --lib --tests \
            -E 'not binary(/_integration$/)'
        env:
          RUST_LOG: INFO

  lint:
    name: Lint (fmt & clippy)
    # Skips the release.bump commit — see the note above `jobs:`.
    if: >-
      ${{ github.event_name != 'push'
      || !(startsWith(github.event.head_commit.message, 'bump: ')
      && contains(github.event.head_commit.message, ' version to ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install clippy-sarif
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: clippy-sarif

      - name: Install sarif-fmt
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: sarif-fmt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake clang libclang-dev uuid-dev libbsd-dev

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      # Cheap and toolchain-free, so it runs before the clippy passes: a missing
      # example README fails in seconds rather than after a full lint build.
      - name: Check example documentation
        run: scripts/check-example-docs.sh

      - name: Run rust-clippy
        # Both passes are needed: `--all-features` is not a superset of default
        # in every crate, and the default pass is what most contributors run.
        # They are separate artifact sets (different feature unification), so
        # neither reuses the other's work.
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Generate clippy SARIF report
        if: always()
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --message-format=json \
            | clippy-sarif \
            | tee rust-clippy-results.sarif \
            | sarif-fmt

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  lint-legacy:
    name: Lint legacy (fmt & clippy)
    # Skips the release.bump commit — see the note above `jobs:`.
    if: >-
      ${{ github.event_name != 'push'
      || !(startsWith(github.event.head_commit.message, 'bump: ')
      && contains(github.event.head_commit.message, ' version to ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `legacy/` left the root workspace ahead of the cutover rename
    # (cutover-plan 5.0), so the `lint` job above no longer reaches it. Same
    # two clippy passes it used to get there, just against the nested manifest
    # and on their own runner — which is a wall-clock win, since the legacy
    # feature set no longer has to build before the wingfoil lint can report.
    # This whole job retires with the tree. No SARIF upload: code scanning
    # tracks the surviving engine.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint-legacy
          workspaces: legacy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake clang libclang-dev uuid-dev libbsd-dev

      - name: Run rustfmt
        run: cargo fmt --manifest-path legacy/Cargo.toml --all -- --check

      - name: Run rust-clippy
        run: |
          set -o pipefail
          cargo clippy --manifest-path legacy/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path legacy/Cargo.toml --workspace --all-targets --all-features -- -D warnings
