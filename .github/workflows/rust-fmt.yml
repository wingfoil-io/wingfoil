name: maintenance.fmt

on:
  workflow_dispatch:

jobs:
  format-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      # Keep checkout credentials off disk and supply WF_REBASE_PAT only to
      # the final push step, after formatting and committing have succeeded.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust Toolchains
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all

      - name: Commit changes
        id: commit
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m fmt
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # The PAT (rather than GITHUB_TOKEN) is deliberate: a push authenticated
      # with GITHUB_TOKEN does not trigger workflows, and the point of this job
      # is to get CI to run on the formatted result. It enters the job here and
      # nowhere else — after formatting and committing have succeeded.
      - name: Push Formatted Changes
        if: success() && steps.commit.outputs.committed == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.WF_REBASE_PAT }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
