name: test.integration.postgres

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/postgres-integration.yml'
      - 'crates/wingfoil/src/adapters/postgres**'
      - 'crates/wingfoil/src/adapters/common.rs'
      - 'crates/wingfoil/tests/postgres_integration.rs'
      - 'crates/wingfoil-python/src/adapters/postgres.rs'
      - 'crates/wingfoil-python/tests/test_postgres.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/postgres-integration.yml'
      - 'crates/wingfoil/src/adapters/postgres**'
      - 'crates/wingfoil/src/adapters/common.rs'
      - 'crates/wingfoil/tests/postgres_integration.rs'
      - 'crates/wingfoil-python/src/adapters/postgres.rs'
      - 'crates/wingfoil-python/tests/test_postgres.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Instrumented run is post-merge only; see README.md. Allow-list, not
  # `!= 'pull_request'`: under `workflow_call` the event is the caller's.
  WF_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Same condition again — `env` cannot reference itself here. Used unquoted
  # below, so it word-splits into the command and its flags.
  WF_CARGO_TEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'cargo llvm-cov --no-report' || 'cargo test' }}

jobs:
  postgres-integration:
    name: postgres Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install cargo-llvm-cov
        if: env.WF_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage collection
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-pull postgres image
        # testcontainers pulls the image lazily on first use, which is
        # vulnerable to transient registry flakes. Pull once up front with
        # retries so every test reuses the cached image.
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && exit 0
            echo "pull attempt $i failed, retrying..."
            sleep 5
          done
          echo "failed to pull postgres image after 3 attempts" && exit 1

      - name: Run postgres integration tests
        run: |
          $WF_CARGO_TEST --features postgres-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # No `if: always()`: a half-run report would become this flag's baseline.
      - name: Export postgres coverage
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload postgres coverage to Codecov
        if: env.WF_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          flags: postgres
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # --- Python bindings (wingfoil-python) ---
      # The Rust tests above use testcontainers (per-test container); the Python
      # tests expect a fixed localhost:5432, so start one explicitly.
      - name: Start postgres container for Python tests
        run: |
          docker run -d \
            --name postgres-py \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:16-alpine
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "postgres ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 5432 || (echo "postgres never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest "psycopg[binary]"
          .venv/bin/maturin develop

      - name: Run Python postgres integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_postgres tests/test_postgres.py -v
        env:
          RUST_LOG: INFO

      - name: Dump postgres logs on failure
        if: failure()
        run: docker logs postgres-py

      - name: Stop postgres container
        if: always()
        run: docker rm -f postgres-py || true
