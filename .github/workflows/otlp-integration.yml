name: test.integration.otlp

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'legacy/wingfoil/src/adapters/otlp/**'
      - 'legacy/wingfoil-python/src/py_otlp.rs'
      - 'legacy/wingfoil-python/tests/test_otlp.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: otlp-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  otlp-integration:
    name: OTLP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-legacy
          # Legacy is its own workspace, so its artifacts land in
          # `legacy/target` (cutover-plan 5.0).
          workspaces: legacy

      - name: Run OTLP integration tests
        run: |
          cargo test --manifest-path legacy/Cargo.toml --features otlp-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture otlp::integration_tests
        env:
          RUST_LOG: INFO

      - name: Start OTel collector for Python tests
        run: |
          docker run -d \
            --name otel-py \
            -p 4318:4318 \
            otel/opentelemetry-collector:latest
          for i in $(seq 1 30); do
            nc -z localhost 4318 && echo "otel collector ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done
          nc -z localhost 4318 || (echo "otel collector never became ready" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: legacy/wingfoil-python/pyproject.toml

      - name: Install system dependencies
        run: sudo apt-get install -y protobuf-compiler

      - name: Install maturin and build Python bindings
        run: |
          python -m venv legacy/wingfoil-python/.venv
          legacy/wingfoil-python/.venv/bin/pip install maturin pytest
          cd legacy/wingfoil-python && .venv/bin/maturin develop

      - name: Run Python OTLP integration tests
        run: |
          cd legacy/wingfoil-python && .venv/bin/pytest -m requires_otel tests/test_otlp.py -v
        env:
          RUST_LOG: INFO

      - name: Dump otel collector logs on failure
        if: failure()
        run: docker logs otel-py

      - name: Stop otel collector
        if: always()
        run: docker stop otel-py && docker rm otel-py
