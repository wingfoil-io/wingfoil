name: test.integration.iceoryx2-next

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'crates/wingfoil-next/src/adapters/iceoryx2/**'
      - 'crates/wingfoil-next/tests/iceoryx2_adapter.rs'
      - 'crates/wingfoil-next/tests/iceoryx2_integration.rs'
      - 'crates/wingfoil-next-python/src/adapters/iceoryx2.rs'
      # The binding's `stages` path splits and packs its wire header through
      # this module, and only the marked tier below round-trips it.
      - 'crates/wingfoil-next-python/src/latency.rs'
      - 'crates/wingfoil-next-python/tests/test_iceoryx2.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: iceoryx2-next-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  iceoryx2-next-integration:
    name: iceoryx2 (next) Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      # iceoryx2 is daemonless: `Ipc` needs only a writable /dev/shm, which the
      # runner provides, so there is no service or container to start. This runs
      # both the Local-variant suite and the cross-process Ipc suite.
      - name: Run iceoryx2 (next) integration tests (Local + IPC)
        run: |
          cargo test --features iceoryx2-integration-test -p wingfoil-next \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # --- Python bindings (wingfoil-next-python) ---
      # Daemonless here too: nothing to start, the marker only keeps a live-clock
      # tier out of the default run.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-next-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the next Python bindings
        working-directory: crates/wingfoil-next-python
        # iceoryx2 is out of the wheel's default features (Linux/POSIX-only), so
        # it is requested explicitly here.
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop -F extension-module,iceoryx2

      # As with aeron: `test_iceoryx2.py` skips itself when the module lacks the
      # surface, and an all-skipped run still exits 0 — so prove it is in.
      - name: Check the iceoryx2 surface is present
        working-directory: crates/wingfoil-next-python
        run: .venv/bin/python -c "import wingfoil_next as wf; assert hasattr(wf, 'iceoryx2_sub')"

      - name: Run Python iceoryx2 (next) integration tests
        working-directory: crates/wingfoil-next-python
        run: .venv/bin/pytest -m requires_iceoryx2 tests/test_iceoryx2.py -v
        env:
          RUST_LOG: INFO
