name: test.integration.iceoryx2

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/iceoryx2-integration.yml'
      - 'crates/wingfoil/src/adapters/iceoryx2/**'
      - 'crates/wingfoil/tests/iceoryx2_adapter.rs'
      - 'crates/wingfoil/tests/iceoryx2_integration.rs'
      - 'crates/wingfoil-python/src/adapters/iceoryx2.rs'
      # The binding's `stages` path splits and packs its wire header through
      # this module, and only the marked tier below round-trips it.
      - 'crates/wingfoil-python/src/latency.rs'
      - 'crates/wingfoil-python/tests/test_iceoryx2.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/iceoryx2-integration.yml'
      - 'crates/wingfoil/src/adapters/iceoryx2/**'
      - 'crates/wingfoil/tests/iceoryx2_adapter.rs'
      - 'crates/wingfoil/tests/iceoryx2_integration.rs'
      - 'crates/wingfoil-python/src/adapters/iceoryx2.rs'
      # The binding's `stages` path splits and packs its wire header through
      # this module, and only the marked tier below round-trips it.
      - 'crates/wingfoil-python/src/latency.rs'
      - 'crates/wingfoil-python/tests/test_iceoryx2.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: iceoryx2-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Instrumented run is post-merge only; see README.md. Allow-list, not
  # `!= 'pull_request'`: under `workflow_call` the event is the caller's.
  WF_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # Same condition again — `env` cannot reference itself here. Used unquoted
  # below, so it word-splits into the command and its flags.
  WF_CARGO_TEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'cargo llvm-cov --no-report' || 'cargo test' }}

jobs:
  iceoryx2-integration:
    name: iceoryx2 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install cargo-llvm-cov
        if: env.WF_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare coverage collection
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      # iceoryx2 is daemonless: `Ipc` needs only a writable /dev/shm, which the
      # runner provides, so there is no service or container to start. This runs
      # both the Local-variant suite and the cross-process Ipc suite.
      - name: Run iceoryx2 integration tests (Local + IPC)
        run: |
          $WF_CARGO_TEST --features iceoryx2-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture
        env:
          RUST_LOG: INFO

      # No `if: always()`: a half-run report would become this flag's baseline.
      - name: Export iceoryx2 coverage
        if: env.WF_COVERAGE == 'true'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload iceoryx2 coverage to Codecov
        if: env.WF_COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: lcov.info
          flags: iceoryx2
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # --- Python bindings (wingfoil-python) ---
      # Daemonless here too: nothing to start, the marker only keeps a live-clock
      # tier out of the default run.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crates/wingfoil-python/pyproject.toml

      - name: Install patchelf
        # maturin uses it to build the extension module on Linux.
        run: sudo apt-get install -y patchelf

      - name: Build the Python bindings
        working-directory: crates/wingfoil-python
        # iceoryx2 is out of the wheel's default features (Linux/POSIX-only), so
        # it is requested explicitly here.
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop -F extension-module,iceoryx2

      # As with aeron: `test_iceoryx2.py` skips itself when the module lacks the
      # surface, and an all-skipped run still exits 0 — so prove it is in.
      - name: Check the iceoryx2 surface is present
        working-directory: crates/wingfoil-python
        run: .venv/bin/python -c "import wingfoil as wf; assert hasattr(wf, 'iceoryx2_sub')"

      - name: Run Python iceoryx2 integration tests
        working-directory: crates/wingfoil-python
        run: .venv/bin/pytest -m requires_iceoryx2 tests/test_iceoryx2.py -v
        env:
          RUST_LOG: INFO
