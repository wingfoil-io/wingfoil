name: test.integration.iceoryx2

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'legacy/wingfoil/src/adapters/iceoryx2/**'
      - 'legacy/wingfoil-python/src/py_iceoryx2.rs'
      - 'legacy/wingfoil-python/tests/test_iceoryx2.py'

# One in-flight run per ref. Superseded PR pushes are cancelled; pushes to
# main/next are not, so every merged commit keeps a status of its own. The
# group name is a literal, not ${{ github.workflow }}: when this workflow is
# reached through `workflow_call` that expression resolves to the *caller's*
# name, which would make every reusable leg share one group and cancel its
# siblings.
concurrency:
  group: iceoryx2-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  iceoryx2-integration:
    name: iceoryx2 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Run iceoryx2 integration tests (Local + IPC)
        run: |
          cargo test --features iceoryx2-integration-test -p wingfoil \
            -- --test-threads=1 --nocapture iceoryx2::
        env:
          RUST_LOG: INFO

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: legacy/wingfoil-python/pyproject.toml

      - name: Install maturin and build Python bindings with iceoryx2
        run: |
          python -m venv legacy/wingfoil-python/.venv
          legacy/wingfoil-python/.venv/bin/pip install maturin pytest
          cd legacy/wingfoil-python && .venv/bin/maturin develop --features iceoryx2

      - name: Run Python iceoryx2 integration tests
        run: |
          cd legacy/wingfoil-python && .venv/bin/pytest -m requires_iceoryx2 tests/test_iceoryx2.py -v
        env:
          RUST_LOG: INFO
