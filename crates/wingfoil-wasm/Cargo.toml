[package]
name = "wingfoil-wasm"
version = "9.0.0"
authors = ["wingfoil@wingfoil.io"]
edition = "2024"
license = "Apache-2.0"
description = "Browser-side WebAssembly codec for the wingfoil web adapter."
repository = "https://github.com/wingfoil-io/wingfoil/"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wingfoil-wire-types = { path = "../wingfoil-wire-types", version = "9.0.0" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_json = "1.0"
anyhow = "1.0"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

# This crate is its *own* workspace root, holding its own `Cargo.lock`. The root
# `Cargo.toml` already excludes it (it targets wasm32-unknown-unknown), and with
# no manifest above the repo root cargo infers standalone-ness on its own — but
# only there. Check the repo out *inside* another cargo workspace (a git
# worktree under `.claude/worktrees/`, a vendored subtree) and cargo walks past
# the exclusion to the outer manifest and refuses:
#
#     error: current package believes it's in a workspace when it's not
#
# which makes the lockfile this crate ships impossible to regenerate or verify
# with `--locked` from such a checkout. Declaring the table states the intent in
# the manifest instead of inferring it from what happens to sit above the repo.
[workspace]
