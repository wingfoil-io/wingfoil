# =============================================================================
# Examples
# =============================================================================
# The `examples/` tree is grouped by what an example teaches:
#
#   examples/core/      — engine concepts (wiring, run modes, tiers, threading)
#   examples/adapters/  — one directory per I/O adapter
#   examples/showcase/  — multi-process, end-to-end latency demonstrations
#
# Every example lives in its own directory alongside a `README.md`, so the
# paths below are explicit and `autoexamples` is off. Target *names* are
# unchanged by the grouping — `cargo run --example <name>` is the same as it
# always was. `examples/README.md` is the index.

# --- Core concepts -----------------------------------------------------------

