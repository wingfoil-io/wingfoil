[package]
name = "wingfoil-derive"
version = "9.0.0"
edition = "2024"
authors = ["wingfoil@wingfoil.io"]
license = "Apache-2.0"
homepage = "https://github.com/wingfoil-io/wingfoil/"
documentation = "https://docs.rs/wingfoil-derive"
rust-version.workspace = true
# Publishable from the cutover on (was `false` while these crates were
# prototypes under interim names). Same registry list as the legacy
# crates it replaces.
publish = ["wingfoil", "crates-io"]
description = "nitro! proc macro for wingfoil: one wiring definition, interpreted and compiled execution"
readme = "README.md"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
# Formats the closure text `#[wiring]` records. A proc macro cannot recover the
# original snippet on stable (`Span::source_text` gives one token; joining spans
# is nightly), so the tokens are re-printed — and re-printing them *well* is what
# keeps a generated artifact reviewable. Costs nothing in the dependency graph:
# it depends only on syn and proc-macro2, both already here.
prettyplease = "0.2"
