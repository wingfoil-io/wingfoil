[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
# The **distribution** name, and it deliberately is not the crate name. Three
# names are in play and only two of them match:
#
#   crates.io  wingfoil-python   (the crate — `crates/wingfoil-python`)
#   PyPI       wingfoil          (this — `pip install wingfoil`)
#   import     wingfoil          (`python/wingfoil`, see `module-name` below)
#
# 9.0 is a cutover, not a new line beside the old one: every name 8.x published
# continues at 9.0.0 (docs/release-notes/9.0.0.md). Naming this distribution
# after the crate would instead have started a *second* PyPI project and left
# `pip install wingfoil` — which is what the root README, this crate's badges
# and release.yml's own release notes all tell users to run — pinned to the
# 8.0.0 legacy engine forever. PyPI has no rename and no delete-and-reupload,
# so that mistake is not recoverable after one upload; the guard in
# `pypi-publish.yml` fails the release rather than let it happen again.
name = "wingfoil"
dynamic = ["version"]
description = "Python bindings for wingfoil (the Op-pattern stream processing engine)"
readme = "README.md"
# 3.9, not 3.8: 3.8 reached end of life in October 2024, and the floor is now
# structural as well as a policy — the extension is built against CPython's
# stable ABI with `abi3-py39` (see Cargo.toml), so 3.9 is the oldest
# interpreter the shipped wheel can load.
requires-python = ">=3.9"
license = "Apache-2.0"
# The `Python :: X.Y` entries are what PyPI (and the README's
# `pypi/pyversions` badge) read to report supported interpreters — neither
# looks at `requires-python`. There is no longer a per-version build matrix to
# keep this in step with: one `cp39-abi3` wheel per platform serves every entry
# below. What that means for the list is that a NEW CPython release can be
# added here the day it ships — no rebuild is needed for it to be installable —
# but it should still only be added once someone has actually run the test
# suite against it.
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["maturin>=1.4,<2.0", "pytest>=7"]

[tool.maturin]
# `extension-module` resolves Python symbols at load time (no libpython link in
# the wheel). Importing `wingfoil` gives the Graph / Stream classes.
#
# **Every adapter binding ships**, because a published wheel is the only copy a
# user gets: an adapter left out is simply absent from the module, and their
# only recourse is a from-source build with a Rust toolchain. Build time is the
# wrong criterion here — it is paid once, in the release job, never by a user —
# so kafka and zmq (which build librdkafka / libzmq from source) and etcd (which
# needs protoc, installed by `pypi-publish.yml`) are all in.
#
# This list is the **portable** feature set — what the macOS and Windows wheels
# are built from. aeron and iceoryx2 are deliberately absent here: iceoryx2 is
# Linux/POSIX-only and aeron builds a C library, so including them would not
# make those wheels richer, it would stop them building at all.
#
# They ARE shipped, on Linux (cutover ruling, #367): `pypi-publish.yml` builds
# the Linux wheel from the `all-adapters` roll-up in Cargo.toml, which includes
# both. So a Linux user gets every adapter, and macOS/Windows users keep a
# working wheel with the portable set — rather than everyone losing out to the
# lowest common denominator.
#
# Keep this list explicit rather than pointing it at `all-adapters`, so adding
# one stays a decision.
features = [
    "extension-module",
    "postgres",
    "kafka",
    "redis",
    "etcd",
    "fluvio",
    "csv",
    "zmq",
    "otlp",
    "augurs",
    "kdb",
    "fix",
    "prometheus",
    "web",
    "ws",
]
# Mixed layout: the compiled extension is the *private* `wingfoil._wingfoil`
# and the importable `wingfoil` is the Python package under `python/`, which
# re-exports it wholesale and adds the pure-Python surface (`CustomStream`).
# `import wingfoil as wf` is unchanged for callers.
python-source = "python"
module-name = "wingfoil._wingfoil"
# `format = "wheel"` is load-bearing, not decoration. maturin's sdist already
# writes a `Cargo.toml` at the root of the archive — the rewritten workspace
# manifest that makes the vendored path dependencies (`wingfoil`,
# `wingfoil-python-derive`) resolve — so an unqualified `include` of this
# crate's own `Cargo.toml` collides with it and `maturin sdist` dies with
# "File wingfoil-<v>/Cargo.toml was already added". Scoping the include
# to the wheel keeps the manifest in the wheel, where it was wanted, and lets
# the sdist build.
include = [{ path = "Cargo.toml", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are deselected by default so the regular `pytest` run is
# never silently green against a service that is not actually up. Each
# integration workflow opts in explicitly, e.g. `pytest -m requires_postgres`.
# Running a marker selection without the backing service fails loudly with a
# real ConnectionRefused/import error — not a skip.
markers = [
    "requires_postgres: needs PostgreSQL on localhost:5432",
    "requires_kafka: needs a Kafka broker on localhost:9092",
    "requires_redis: needs Redis on localhost:6379",
    "requires_etcd: needs etcd on localhost:2379",
    "requires_fluvio: needs a Fluvio cluster on localhost:9003",
    "requires_kdb: needs a q process on localhost:5000",
    "requires_fix: loopback FIX sessions on a live clock (no external service)",
    "requires_web: WebSocket round trips — needs the `websockets` package",
    "requires_aeron: needs a running Aeron media driver (AERON_DIR)",
    "requires_iceoryx2: iceoryx2 round trips on a live clock (no external service)",
]
addopts = "-m 'not requires_postgres and not requires_kafka and not requires_redis and not requires_etcd and not requires_fluvio and not requires_kdb and not requires_fix and not requires_web and not requires_aeron and not requires_iceoryx2'"
